/* Layout: carnet d'athlète — bandeau de forme en haut, onglets collants, cartes par rôle, chiffres en condensé façon tableau d'affichage de stade */
:root{

  --btn:#14263A; --btn-ink:#FFFFFF;
  --good:#22894F; --warn:#C17A00; --bad:#C2372C; --info:#2E6FA8;
  --s-course:#E4572E; --s-velo:#2E86AB; --s-natation:#139D90; --s-renfo:#6D5BD0; --s-basket:#D9951A; --s-autre:#87919B;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}

  --paper:#0E141A; --card:#161F28; --ink:#E7ECF1; --muted:#95A1AD; --line:#26313C; --soft:#1B252F;
  --btn:#E7ECF1; --btn-ink:#0E141A;
  --good:#3DBB72; --warn:#E3A21A; --bad:#EE5B4F; --info:#5AA2E0;
  --s-course:#F06A43; --s-velo:#4AA3C9; --s-natation:#2EC0B1; --s-renfo:#8C7CEB; --s-basket:#EBAA34; --s-autre:#9AA4AE;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E141A; --card:#161F28; --ink:#E7ECF1; --muted:#95A1AD; --line:#26313C; --soft:#1B252F;
  --btn:#E7ECF1; --btn-ink:#0E141A;
  --good:#3DBB72; --warn:#E3A21A; --bad:#EE5B4F; --info:#5AA2E0;
  --s-course:#F06A43; --s-velo:#4AA3C9; --s-natation:#2EC0B1; --s-renfo:#8C7CEB; --s-basket:#EBAA34; --s-autre:#9AA4AE;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

h1{font-size:30px;line-height:1}

.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* header */
header.top{padding-block:18px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:4px}
.lanes{display:flex;gap:3px;height:4px;width:96px}

.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--good)} .dot.wait{background:var(--warn)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);margin-bottom:16px}

nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s-course)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}

.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

.banner{border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--card));border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}

/* KPI strip */

.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--info)} .pill.mut{color:var(--muted)}

.ai-out{white-space:pre-wrap;font-size:14.5px;background:var(--soft);border-radius:8px;padding:12px 14px}

/* activities */
.list{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:9px;padding:9px 15px;font-weight:600;font-size:14.5px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 11px;font-size:13.5px}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

.drop{border:2px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--soft)}
.drop.over{border-color:var(--s-course)}
details summary{cursor:pointer;font-weight:600}

details li{margin-bottom:4px}

/* planning */
.zone{color:var(--ink);font-weight:600}
.zones{display:grid;gap:4px}.zones .zr{display:grid;grid-template-columns:36px 1fr auto;gap:8px;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line,#e3e6ea)}

.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}

.item{border-radius:8px;padding:7px 9px;font-size:13.5px;border-left:4px solid var(--c,var(--muted));background:var(--soft);display:flex;flex-direction:column;gap:2px;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.item .it{font-weight:600;overflow-wrap:anywhere}
.item .im{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.addday{background:none;border:1px dashed var(--line);border-radius:8px;color:var(--muted);padding:5px;font-size:13px;margin-top:auto}
.addday:hover{color:var(--ink);border-color:var(--muted)}

.chartbox{position:relative;height:240px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

.sheet{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.sheet{border-radius:16px;padding:22px}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.hint{font-size:12.5px;color:var(--muted)}

.setup .n{width:26px;height:26px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.kvs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}

.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)} .kv .v{overflow-wrap:anywhere}

}

/* ============ données d'exemple ============ */
function demoActs(){
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const out=[]; const td=today0(); const start=addDays(startOfWeek(td),-63);
  const week=[ [1,"course",45,"facile"],[1,"renfo",50],[2,"natation",40],[3,"course",50,"intense"],[4,"renfo",45],[4,"velo",60],[5,"basket",80],[6,"course",75,"long"] ];
  for(let w=0;w<10;w++){
    const prog = w===6 ? .75 : 1+w*.03;
    for(const [wd,sp,base,kind] of week){
      const d=addDays(start,w*7+wd); if(d>td) continue;
      if(rnd()<.12) continue;
      const min=Math.round(base*prog*(.9+rnd()*.2)); const dur=min*60;
      let dist=null,hr=null,hrMax=null,asc=null;
      if(sp==="course"){ const pace = kind==="intense"?4.7:kind==="long"?5.75:5.6-w*.03; dist=+(min/pace).toFixed(2); hr=kind==="intense"?168:kind==="long"?148:143; hrMax=hr+18; asc=Math.round(dist*8); }
      if(sp==="velo"){ dist=+(min/60*(24+w*.4)).toFixed(1); hr=132; hrMax=158; asc=Math.round(dist*9); }
      if(sp==="natation"){ dist=+(min*0.042+w*.02).toFixed(2); hr=138; hrMax=158; }
      if(sp==="basket"){ hr=150; hrMax=185; }
      if(sp==="renfo"){ hr=118; hrMax=150; }
      hr = hr ? Math.round(hr+(rnd()-.5)*6) : null;
      out.push({id:"demo"+out.length,date:`${dayKey(d)}T18:${pad(Math.floor(rnd()*59))}`,sport:sp,title:SPORTS[sp].l+(kind==="intense"?t(" — fractionné"," — intervals"):kind==="long"?t(" — sortie longue"," — long run"):""),dist,dur,hr,hrMax,cal:Math.round(min*9),asc,rpe:null,src:"exemple"});

/* ============ charge d'entraînement ============ */
function load(a){
  const min=(a.dur||0)/60; const {hrMax,hrRest}=S.set;
  if(a.hr && hrMax>hrRest){ const x=Math.min(1,Math.max(0,(a.hr-hrRest)/(hrMax-hrRest))); return min*x*0.64*Math.exp(1.92*x); }
  if(!a.rpe && a.re) return a.re;
  const f = a.sport==="basket"?1.1:a.sport==="renfo"?.85:1;
  return min*0.45*(a.rpe||5)*f;
}
function isHard(a){
  if(a.rpe) return a.rpe>=7;
  if(!a.hr) return false;
  const {hrMax,hrRest}=S.set; return (a.hr-hrRest)/(hrMax-hrRest)>=.78;
}
function dailySeries(acts,days){
  const t=today0(); const map={};
  for(const a of acts){ const k=a.date.slice(0,10); map[k]=(map[k]||0)+load(a); }
  const first = acts.length ? acts.reduce((m,a)=>a.date<m?a.date:m,acts[0].date).slice(0,10) : dayKey(t);
  let d=parseDay(first); const lim=addDays(t,-1500); if(d<lim) d=lim;
  const out=[]; let ctl=0,atl=0;
  while(d<=t){ const k=dayKey(d); const l=map[k]||0; ctl+=(l-ctl)/42; atl+=(l-atl)/7; out.push({k,d:new Date(d),l,ctl,atl,tsb:ctl-atl}); d=addDays(d,1); }
  return days ? out.slice(-days) : out;
}
function metrics(acts){
  const ser=dailySeries(acts); const last=ser[ser.length-1]||{ctl:0,atl:0,tsb:0};
  const sum=(n)=>ser.slice(-n).reduce((s,x)=>s+x.l,0);
  const a7=sum(7), c28=sum(28)/4;
  const acwr = c28>0 ? a7/c28 : null;
  const l7=ser.slice(-7).map(x=>x.l); const mean=l7.reduce((s,x)=>s+x,0)/7;
  const sd=Math.sqrt(l7.reduce((s,x)=>s+(x-mean)**2,0)/7);
  return {ser,ctl:last.ctl,atl:last.atl,tsb:last.tsb,a7,c28,acwr,monotony: sd>0?mean/sd:null,histDays:ser.length};
}
function acwrState(r){

  if(r>1.5) return ["bad",t("Pic de charge","Load spike")];
  if(r>1.3) return ["warn",t("Charge élevée","High load")];

}

  if(t_<-10) return ["warn",t("En construction","Building")];
  if(t_>15) return ["info",t("Très frais","Very fresh")];

/* ============ générateur de semaine ============ */
function suggestWeek(monday,acts){
  const td=today0(); const m=metrics(acts);
  const from=addDays(td,-27); const rec=acts.filter(a=>parseDay(a.date)>=from);
  const per={}, cnt={}; for(const a of rec){ per[a.sport]=(per[a.sport]||0)+a.dur/60/4; cnt[a.sport]=(cnt[a.sport]||0)+1; }
  const tgs=S.set.targets||{};
  let total=Object.values(per).reduce((s,x)=>s+x,0);
  let factor=1.07, note=t("progression +7 %","+7% progression");
  if(m.acwr>1.3||m.tsb<-20){ factor=.8; note=t("semaine allégée (fatigue)","lighter week (fatigue)"); }
  if(!total){ total=(S.set.goalH||5)*60; per.course=total*.4; per.renfo=total*.25; per.natation=total*.2; per.velo=total*.15; factor=1; note=t("répartition de départ","starting split"); }
  const sessions=[];
  for(const sp of SK){
    const tg=tgs[sp]; let mins=(per[sp]||0)*factor, n;
    if(tg===0) continue;
    if(tg>0){ n=Math.min(tg,7); const avg=cnt[sp]?(per[sp]*4/cnt[sp]):SPORTS[sp].len; mins=Math.max(mins,n*Math.max(30,avg)*(factor<1?0.8:1)); }
    else { if(mins<20) continue; n=Math.min(4,Math.max(1,Math.round(mins/SPORTS[sp].len))); }
    const each=Math.round(mins/n/5)*5;
    for(let i=0;i<n;i++){
      let int="facile", title=SPORTS[sp].l+" — endurance", long=false;
      if(sp==="renfo"){ int="modere"; title=i%2?t("Renfo — tirage & gainage","Strength — pull & core"):t("Renfo — poussée & jambes","Strength — push & legs"); }
      else if(sp==="basket"){ int="intense"; title=SPORTS.basket.l; }
      else if(sp==="autre"){ title=t("Activité libre","Free activity"); }
      else if(n>=2 && i===0){ int="intense"; title=sp==="course"?t("Course — fractionné / seuil","Run — intervals / threshold"):sp==="velo"?t("Vélo — intervalles","Bike — intervals"):t("Natation — séries","Swim — sets"); }
      else if(n>=3 && i===n-1 && (sp==="course"||sp==="velo")){ long=true; title=sp==="course"?t("Course — sortie longue","Run — long run"):t("Vélo — sortie longue","Bike — long ride"); }
      const dur = long ? Math.round(each*1.4/5)*5 : (int==="intense"&&sp!=="basket") ? Math.max(30,Math.round(each*.85/5)*5) : each;
      sessions.push({sport:sp,title,dur,int,long});
    }
  }
  const rest=S.set.restDay ?? 0; const load=[0,0,0,0,0,0,0]; const hard=[0,0,0,0,0,0,0]; const res=[];
  const order=[...sessions].sort((a,b)=>(b.long-a.long)||((b.int==="intense")-(a.int==="intense"))||b.dur-a.dur);
  for(const s of order){
    let cands=[0,1,2,3,4,5,6].filter(d=>d!==rest);
    if(s.long) cands=cands.filter(d=>d>=5).concat(cands.filter(d=>d<5));
    let best=null,score=1e9;
    for(const d of cands){
      let sc=load[d];
      if(s.int==="intense"&&(hard[d]||hard[d-1]||hard[d+1])) sc+=500;
      if(s.long&&d<5) sc+=200;
      if(s.int==="intense"&&(d===1||d===3)) sc-=20;
      if(sc<score){ score=sc; best=d; }
    }
    load[best]+=s.dur; if(s.int==="intense"||s.long) hard[best]=1;
    res.push({date:dayKey(addDays(monday,best)),time:S.set.defTime||"18:00",sport:s.sport,title:s.title,dur:s.dur,int:s.int,notes:t(`Proposé automatiquement : ${note}.`,`Suggested automatically: ${note}.`),gen:true});
  }
  return res;
}

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[®™"]/g,"").trim();
function mapSport(s){

  if(/cycl|velo|bike|biking|ride|vtt|gravel|spinning|home trainer/.test(x)) return "velo";
  if(/run|course|trail|tapis|jogg/.test(x)) return "course";

  if(/basket/.test(x)) return "basket";
  return "autre";
}
function num(v){
  if(v==null) return null; let s=String(v).trim().replace(/\s| | /g,"");
  if(!s||s==="--"||s==="-") return null;
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/,/g,"");
  else if(/,/.test(s)&&!/\./.test(s)) s=s.replace(",",".");
  else s=s.replace(/,/g,"");
  const n=parseFloat(s); return isNaN(n)?null:n;
}
function dur(v){

  if(!s.includes(":")) { const n=num(s); return n; }
  const p=s.split(":").map(Number); if(p.some(isNaN)) return null;
  return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1];

  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return `${m[1]}-${m[2]}-${m[3]}T12:00`;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,]+(\d{1,2}):(\d{2}))?/))) return `${m[3]}-${pad(m[2])}-${pad(m[1])}T${pad(m[4]||12)}:${m[5]||"00"}`;

}
function csvRows(text){

  const first=text.split(/\r?\n/)[0]||""; const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":",";
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){

    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(cur); cur=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cur); rows.push(row); row=[]; cur=""; }

  return tag(doc,"Activity").map(act=>{
    const laps=tag(act,"Lap"); let sec=0,m=0,cal=0,hrW=0,hrMx=0;
    for(const l of laps){ const s=+tval(l,"TotalTimeSeconds")||0; sec+=s; m+=+tval(l,"DistanceMeters")||0; cal+=+tval(l,"Calories")||0;
      const ah=tag(l,"AverageHeartRateBpm")[0]; if(ah) hrW+=(+tval(ah,"Value")||0)*s;
      const mh=tag(l,"MaximumHeartRateBpm")[0]; if(mh) hrMx=Math.max(hrMx,+tval(mh,"Value")||0); }
    let asc=0,prev=null; for(const a of tag(act,"AltitudeMeters")){ const v=+a.textContent; if(prev!=null&&v-prev>0.3) asc+=v-prev; prev=v; }
    const sport=mapSport((act.getAttribute("Sport")||"")+" "+(tval(act,"Notes")||"")+" "+fname);
    const start=tval(act,"Id")||laps[0]?.getAttribute("StartTime");
    return {date:parseDateStr(start),sport,title:SPORTS[sport].l,dist:m?+(m/1000).toFixed(3):null,dur:Math.round(sec),hr:hrW&&sec?Math.round(hrW/sec):null,hrMax:hrMx||null,cal:cal||null,asc:asc?Math.round(asc):null,src:"garmin-tcx"};
  }).filter(a=>a.date&&a.dur);
}
function parseGPX(text,fname){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  const pts=tag(doc,"trkpt"); if(pts.length<2) return [];
  const R=6371; let d=0,asc=0,hrs=[],prev=null;
  for(const p of pts){
    const la=+p.getAttribute("lat"),lo=+p.getAttribute("lon"),el=+tval(p,"ele"); const hr=+tval(p,"hr");
    if(hr) hrs.push(hr);
    if(prev){ const dLa=(la-prev.la)*Math.PI/180,dLo=(lo-prev.lo)*Math.PI/180;
      const a=Math.sin(dLa/2)**2+Math.cos(prev.la*Math.PI/180)*Math.cos(la*Math.PI/180)*Math.sin(dLo/2)**2; d+=2*R*Math.asin(Math.sqrt(a));
      if(!isNaN(el)&&!isNaN(prev.el)&&el-prev.el>0.3) asc+=el-prev.el; }
    prev={la,lo,el};
  }
  const t0=new Date(tval(pts[0],"time")), t1=new Date(tval(pts[pts.length-1],"time"));
  const sport=mapSport((tval(doc,"type")||"")+" "+(tval(doc,"name")||"")+" "+fname);
  return [{date:parseDateStr(tval(pts[0],"time")),sport,title:tval(doc,"name")||SPORTS[sport].l,dist:+d.toFixed(3),dur:Math.round((t1-t0)/1000),hr:hrs.length?Math.round(hrs.reduce((s,x)=>s+x,0)/hrs.length):null,hrMax:hrs.length?Math.max(...hrs):null,cal:null,asc:Math.round(asc)||null,src:"garmin-gpx"}].filter(a=>a.date&&a.dur>0);
}
async function importFiles(files){
  let parsed=[], errors=[];
  for(const f of files){
    const name=f.name.toLowerCase();
    if(name.endsWith(".fit")||name.endsWith(".zip")){ errors.push(t(`${f.name} : format FIT/ZIP non lu. Exporte l'activité au format TCX ou GPX.`,`${f.name}: FIT/ZIP files aren't supported. Export the activity as TCX or GPX.`)); continue; }
    try{
      const txt=await f.text();
      if(name.endsWith(".csv")) parsed.push(...parseCSV(txt));
      else if(name.endsWith(".tcx")) parsed.push(...parseTCX(txt,name));
      else if(name.endsWith(".gpx")) parsed.push(...parseGPX(txt,name));
      else errors.push(t(`${f.name} : extension non reconnue.`,`${f.name}: unrecognized file type.`));
    }catch(e){ errors.push(`${f.name} : ${e.message}`); }
  }
  const existing=new Set(S.acts.map(a=>a.id));
  const fresh=[]; for(const a of parsed){ a.id="g"+hash(a.date.slice(0,16)+a.sport+Math.round(a.dur/30)); if(!existing.has(a.id) && !findDup(a)){ existing.add(a.id); fresh.push(a); } }
  const dup=parsed.length-fresh.length;
  if(!fresh.length){ toast(errors[0] || (dup?t(`Aucune nouvelle activité (${dup} déjà présentes).`,`No new activities (${dup} already there).`):t("Aucune activité trouvée dans ces fichiers.","No activities found in these files."))); return; }
  const status=$("#import-status");
  let n=0;
  if(S.mode==="db"){
    for(const a of fresh){ try{ await putAct(a); }catch(e){ if(e?.code==="quota_exceeded"){ toast(t("Stockage plein : supprime d'anciennes activités.","Storage full: delete some old activities.")); break; } } n++; if(status) status.textContent=t(`Import en cours… ${n}/${fresh.length}`,`Importing… ${n}/${fresh.length}`); }
  } else { S.acts.push(...fresh); lsSet(); n=fresh.length; }
  if(status) status.textContent="";
  toast(t(`${n} activité(s) importée(s)${dup?`, ${dup} doublon(s) ignoré(s)`:""}.`,`${n} activit${n>1?"ies":"y"} imported${dup?`, ${dup} duplicate(s) skipped`:""}.`)+(errors.length?" "+errors[0]:""));
  render();
}

async function stravaPost(body){
  if(S.stravaApp?.clientId && S.stravaApp?.clientSecret){ body={...body,client_id:S.stravaApp.clientId,client_secret:S.stravaApp.clientSecret}; }
  const r=await fetch("/.netlify/functions/strava",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw {code:r.status===401||r.status===400?"api_auth":"api_error",message:j.error,fields:j.fields||""};
  return j;
}
async function stravaToken(){
  let t=S.stravaTok; if(!t||!t.refresh_token) throw {code:"api_not_linked"};
  if((t.expires_at||0)*1000 < Date.now()+120e3){
    const n=await stravaPost({action:"refresh",refresh_token:t.refresh_token});
    t={...t,...n}; S.stravaTok=t; await refs.strava.set(t);
  }
  return t.access_token;

function stravaAuthorize(){

async function fetchStravaSince(since){
  if(S.stravaMode==="api"){
    const tok=await stravaToken(); const after=Math.floor(since.getTime()/1000); const out=[];
    for(let page=1;page<=10;page++){
      const r=await fetch(`/.netlify/functions/strava?action=activities&after=${after}&page=${page}`,{headers:{Authorization:"Bearer "+tok}});
      if(r.status===401) throw {code:"api_auth"}; if(r.status===429) throw {code:"server_unavailable"}; if(!r.ok) throw {code:"api_error"};
      const arr=await r.json(); out.push(...arr.map(fromStravaApi)); if(arr.length<100) break;
    }
    return {list:out,needPerf:false};
  }
  const range_start=`${dayKey(since)}T00:00:00`; let after=null, raw=[], pages=0;
  do{
    const input={first:100,range_start,ordering:"StartDateLocalDesc"}; if(after) input.after=after;
    const r=await S.mcp.callTool("Strava","list_activities",input,{cache:false});
    const p=r.payload||{}; raw.push(...(p.activities||[])); after=p.has_next_page?p.end_cursor:null; pages++;
  }while(after && pages<10);
  return {list:raw.map(fromStrava),needPerf:true};
}
async function syncStrava(){
  if(!S.stravaMode||S.strava.busy) return;
  const setMsg=(msg,err=false,busy=true)=>{ S.strava={busy,msg,err}; const el=$("#strava-status"); if(el){ el.textContent=msg; el.parentElement.classList.toggle("err",err);} const b=$("#strava-sync"); if(b) b.disabled=busy; };
  setMsg(t("Recherche des nouvelles séances…","Looking for new sessions…"));
  try{
    const since=S.set.stravaSync ? new Date(Date.parse(S.set.stravaSync)-3*864e5) : addDays(today0(),-365);
    const {list,needPerf}=await fetchStravaSince(since);
    const have=new Set(S.acts.map(a=>a.id)); const fresh=[];
    for(const a of list){ if(!a.date||!a.dur||have.has(a.id)||findDup(a)) continue; have.add(a.id); fresh.push(a); }
    let n=0;
    for(const a of fresh){
      if(needPerf && n<80){
        try{
          const r=await S.mcp.callTool("Strava","get_activity_performance",{activity_id:a.sid},{cache:false}); const p=r.payload||{};
          if(p.has_heartrate&&p.average_heartrate){ a.hr=Math.round(p.average_heartrate); a.hrMax=p.max_heartrate?Math.round(p.max_heartrate):null; }
          const pe=p.perceived_exertion??p.perceivedExertion; if(typeof pe==="number"&&pe>0) a.rpe=pe;
          if(p.calories&&!a.cal) a.cal=Math.round(p.calories);
        }catch(e){ if(["server_not_connected","needs_reauth","not_in_manifest","approval_required","blocked_by_policy"].includes(e?.code)) throw e; }
      }
      if(S.mode==="db"){ const {id,...body}=a; await refs.acts.doc(id).set(body); } else S.acts.push(a);
      n++; setMsg(t(`Import des séances Strava… ${n}/${fresh.length}`,`Importing Strava sessions… ${n}/${fresh.length}`));
    }
    if(S.mode!=="db") lsSet();
    if(fresh.length&&notifSupported()&&S.set.notifOn&&S.set.notifAnalysis!==false&&Notification.permission==="granted"){
      const all=[...S.acts.filter(x=>!fresh.some(f=>f.id===x.id)),...fresh]; const A=analyzeLast(all,S.plans);
      if(A) showNotif(t(`Séance analysée : ${A.a.title}`,`Session analyzed: ${A.a.title}`),`${A.tag} · ${A.facts.slice(0,3).join(" · ")} — ${A.verdict}`,"forma-last-"+A.a.id);
    }
    S.set.stravaSync=new Date().toISOString();
    if(S.mode==="db"){ try{ await refs.root.set({...S.set}); }catch(e){} }
    setMsg(fresh.length?t(`${fresh.length} nouvelle(s) séance(s) importée(s) depuis Strava.`,`${fresh.length} new session(s) imported from Strava.`):t("Tout est à jour.","Everything is up to date."),false,false);
  }catch(e){ setMsg(stravaErr(e),true,false); S.strava.code=e?.code; }
  render();
}

  const d=(sp-ref); if(Math.abs(d)<0.5) return t("vitesse identique à ta moyenne récente","same speed as your recent average");
  const v=Math.abs(d).toFixed(1).replace(".",DEC()); return d>0?t(`${v} km/h plus rapide que ta moyenne récente`,`${v} km/h faster than your recent average`):t(`${v} km/h plus lent que ta moyenne récente`,`${v} km/h slower than your recent average`);
}
function dayName(k){ const d=parseDay(k), td=today0(); const diff=Math.round((d-td)/864e5); if(diff===0) return t("aujourd'hui","today"); if(diff===1) return t("demain","tomorrow"); if(diff===-1) return t("hier","yesterday"); return `${DAYS_L()[(d.getDay()+6)%7]} ${fmtDate(d)}`; }

function loadState(m){
  if(m.histDays<14) return {lvl:"info",k:"short",l:t("Historique court","Short history")};
  if((m.acwr!=null&&m.acwr>1.5)||m.tsb<-30) return {lvl:"bad",k:"over",l:t("Surcharge","Overload")};
  if((m.acwr!=null&&m.acwr>1.3)||m.tsb<-15) return {lvl:"warn",k:"build",l:t("Bloc chargé","Heavy block")};
  if(m.histDays>=21&&m.acwr!=null&&m.acwr<0.8) return {lvl:"info",k:"low",l:t("Semaine allégée","Light week")};

}
function stateSentence(st,m){

  switch(st.k){

    case "low": return t(`Semaine plus légère que d'habitude (ratio ${r}). Bon moment pour récupérer, ou ajoute une séance facile si tu te sens bien.`,`Lighter week than usual (ratio ${r}). A good time to recover, or add an easy session if you feel good.`);

    default: return t(`Charge équilibrée (ratio ${r}, fraîcheur ${f}). Continue comme prévu.`,`Balanced load (ratio ${r}, freshness ${f}). Carry on as planned.`);

}

function analyzeLast(acts,plans){
  if(!acts.length) return null;
  const sorted=[...acts].sort((a,b)=>b.date.localeCompare(a.date)); const a=sorted[0];
  const dk=a.date.slice(0,10), d=parseDay(dk), since=addDays(d,-42);
  const peers=sorted.slice(1).filter(x=>x.sport===a.sport&&parseDay(x.date)>=since);
  const L=load(a), Lmed=median(peers.map(load)), z=zoneOf(a), sp=speedOf(a);
  const lines=[], facts=[fmtDur(a.dur)];
  if(a.dist) facts.push(`${fmtKm(a.dist)} km`);
  const p=paceStr(a.sport,a); if(p) facts.push(p);
  if(a.hr) facts.push(`♥ ${Math.round(a.hr)}`);
  facts.push(`${Math.round(L)} pts`);
  if(z) lines.push(a.hr ? t(`Intensité : ${z.l} (FC moyenne ${Math.round(a.hr)}, ${Math.round(hrrOf(a)*100)} % de ta réserve cardiaque).`,`Intensity: ${z.l} (average HR ${Math.round(a.hr)}, ${Math.round(hrrOf(a)*100)}% of your heart-rate reserve).`) : t(`Intensité ressentie : ${z.l}.`,`Perceived intensity: ${z.l}.`));
  let rel=null;
  if(Lmed&&peers.length>=2){
    rel=L/Lmed;
    const lab = rel<0.7?t("plus légère que d'habitude","lighter than usual") : rel<=1.3?t("dans tes habitudes","in line with your usual") : rel<=1.8?t("plus costaude que d'habitude","harder than usual") : t("nettement plus exigeante que d'habitude","much harder than usual");
    lines.push(t(`Charge : ${Math.round(L)} pts, ${lab} en ${SPORTS[a.sport].l.toLowerCase()} (médiane ${Math.round(Lmed)} pts sur 6 semaines).`,`Load: ${Math.round(L)} pts, ${lab} for ${SPORTS[a.sport].l.toLowerCase()} (median ${Math.round(Lmed)} pts over 6 weeks).`));
  }
  const peerSp=peers.map(speedOf).filter(Boolean);
  if(sp&&peerSp.length>=2&&["course","velo","natation"].includes(a.sport)) lines.push(t("Vitesse : ","Speed: ")+paceDelta(a.sport,sp,median(peerSp))+".");
  if(sp&&a.hr&&a.sport!=="natation"){
    const eff=x=>speedOf(x)/x.hr; const pe=peers.filter(x=>speedOf(x)&&x.hr);
    if(pe.length>=3){ const r=eff(a)/median(pe.map(eff))-1; const pc=Math.round(Math.abs(r)*100);
      if(r>=0.03) lines.push(t(`Efficacité aérobie (vitesse par battement) +${pc} % : bon signe de progression d'endurance.`,`Aerobic efficiency (speed per heartbeat) +${pc}%: a good sign of endurance progress.`));
      else if(r<=-0.03) lines.push(t(`Efficacité aérobie −${pc} % : fatigue, chaleur, dénivelé ou terrain lent possibles.`,`Aerobic efficiency −${pc}%: possibly fatigue, heat, climbing or slow terrain.`)); }
  }
  if(peers.length>=3){
    if(a.dist&&a.dist>Math.max(...peers.map(x=>x.dist||0))) lines.push(t(`Plus longue distance en ${SPORTS[a.sport].l.toLowerCase()} depuis 6 semaines.`,`Longest ${SPORTS[a.sport].l.toLowerCase()} distance in 6 weeks.`));
    else if(a.dur>Math.max(...peers.map(x=>x.dur||0))) lines.push(t(`Plus longue séance de ${SPORTS[a.sport].l.toLowerCase()} depuis 6 semaines.`,`Longest ${SPORTS[a.sport].l.toLowerCase()} session in 6 weeks.`));
  }
  const plan=plans.find(x=>x.date===dk&&x.sport===a.sport);
  let lvl="good";
  if(plan&&z){
    if(plan.int==="facile"&&z.z>=3){ lvl="warn"; lines.push(t(`Prévue facile, réalisée en ${z.l} : garde tes séances faciles vraiment faciles pour mieux encaisser les dures.`,`Planned easy, done at ${z.l}: keep easy sessions truly easy so you absorb the hard ones better.`)); }
    else if(plan.int==="intense"&&z.z<=2) lines.push(t("Prévue intense, restée en endurance : séance clé à replacer si tu te sens frais.","Planned hard, stayed easy: reschedule the key session if you feel fresh."));
    else lines.push(t(`Conforme au plan (« ${plan.title} »).`,`Matches the plan (“${plan.title}”).`));
  }
  const longS=a.dur>=90*60;
  const veryHard=(z&&z.z>=5)||(rel&&rel>1.8)||(z&&z.z>=4&&longS), hard=veryHard||(z&&z.z>=4)||(rel&&rel>1.3);
  const moderate=!hard&&((z&&z.z===3)||(rel&&rel>1.1)||longS);
  let verdict, tag;
  if(veryHard){ lvl="warn"; tag=t("Très exigeante","Very hard"); verdict=t("Séance très exigeante. Compte environ 48 h avant ta prochaine séance intense : sommeil, hydratation, et de l'endurance facile entre-temps.","Very demanding session. Allow about 48 h before your next hard session: sleep, hydration, and easy endurance in between."); }
  else if(hard){ lvl=lvl==="good"?"info":lvl; tag=t("Costaude","Hard"); verdict=t("Bonne séance de qualité. Garde 24 à 48 h faciles avant de remettre de l'intensité.","Solid quality session. Keep 24 to 48 h easy before adding intensity again."); }
  else if(moderate){ lvl=lvl==="good"?"info":lvl; tag=t("Modérée","Moderate"); verdict=t(`Séance modérée${longS?" et longue":""} : elle compte dans ta fatigue. Garde au moins 24 h faciles avant une séance intense.`,`Moderate${longS?", long":""} session: it adds to your fatigue. Keep at least 24 easy hours before a hard session.`); }
  else { tag=t("Facile","Easy"); verdict=t("Séance facile qui construit ton endurance sans trop fatiguer : tu peux enchaîner normalement.","Easy session that builds endurance without much fatigue: you can carry on as normal."); }
  const st=loadState(metrics(acts));
  if(st.k==="over"){ lvl=lvl==="good"||lvl==="info"?"warn":lvl; verdict+=" "+t("Mais ta charge globale est en surcharge : priorité à la récupération ces prochains jours.","But your overall load is in overload: prioritize recovery over the next few days."); }
  else if(st.k==="build"&&(hard||moderate)) verdict+=" "+t("Ta semaine est déjà chargée : reste en facile jusqu'à ta prochaine séance clé.","Your week is already heavy: stay easy until your next key session.");
  let next="";
  const np=plans.filter(x=>x.date>dk&&x.date>=dayKey(today0())).sort((x,y)=>x.date.localeCompare(y.date))[0];
  if(np){
    const gap=Math.round((parseDay(np.date)-d)/864e5);
    if((hard||moderate||st.k==="over")&&np.int==="intense"&&gap<=1) next=t(`Ta prochaine séance prévue, « ${np.title} » (${dayName(np.date)}), est intense : décale-la d'un jour ou passe-la en facile.`,`Your next planned session, “${np.title}” (${dayName(np.date)}), is hard: move it a day or make it easy.`);
    else next=t(`Prochaine séance prévue : « ${np.title} », ${dayName(np.date)}, ${np.dur} min.`,`Next planned session: “${np.title}”, ${dayName(np.date)}, ${np.dur} min.`);
  }
  return {a,facts,lines,verdict,tag,lvl,next,hard:hard||moderate,veryHard,z};
}

function analyzeWeek(acts,plans){
  const td=today0(), mon=startOfWeek(td), dayIdx=(td.getDay()+6)%7, tk=dayKey(td);
  const inW=(x,a,b)=>{ const d=parseDay(x.date); return d>=a&&d<b; };
  const sec=xs=>xs.reduce((s,x)=>s+(x.dur||0),0);
  const cur=acts.filter(x=>inW(x,mon,addDays(td,1)));
  const prevTo=[1,2,3,4].map(i=>{ const s=addDays(mon,-7*i); return acts.filter(x=>inW(x,s,addDays(s,dayIdx+1))); });
  const avgTo=prevTo.map(sec).reduce((s,x)=>s+x,0)/4, avgN=prevTo.reduce((s,x)=>s+x.length,0)/4;
  const m=metrics(acts), st=loadState(m), lines=[];
  const h=sec(cur)/3600;
  if(avgTo>600){ const pc=Math.round((sec(cur)/avgTo-1)*100);
    lines.push(t(`${fmtH(sec(cur))} h et ${cur.length} séance(s) depuis lundi, contre ${fmtH(avgTo)} h en moyenne à ce stade de la semaine (${pc>=0?"+":""}${pc} %).`,`${fmtH(sec(cur))} h and ${cur.length} session(s) since Monday, vs ${fmtH(avgTo)} h on average at this point of the week (${pc>=0?"+":""}${pc}%).`)); }
  else lines.push(t(`${fmtH(sec(cur))} h et ${cur.length} séance(s) depuis lundi.`,`${fmtH(sec(cur))} h and ${cur.length} session(s) since Monday.`));
  const by={}; cur.forEach(x=>{ by[x.sport]=by[x.sport]||{n:0,km:0,s:0}; by[x.sport].n++; by[x.sport].km+=x.dist||0; by[x.sport].s+=x.dur; });
  const parts=Object.entries(by).sort((a,b)=>b[1].s-a[1].s).map(([k,v])=>`${SPORTS[k].l} ${v.n}×${v.km?` · ${fmtKm(v.km)} km`:` · ${fmtDur(v.s)}`}`);
  if(parts.length) lines.push(parts.join(" — "));
  const hardN=cur.filter(x=>{ const z=zoneOf(x); return z?z.z>=4:isHard(x); }).length;
  if(cur.length){ lines.push(hardN>=3?t(`${hardN} séances intenses cette semaine : c'est beaucoup, vise 1 à 2.`,`${hardN} hard sessions this week: that's a lot, aim for 1 to 2.`):t(`${hardN} séance(s) intense(s) sur ${cur.length}.`,`${hardN} hard session(s) out of ${cur.length}.`)); }
  const wp=plans.filter(p=>{ const d=parseDay(p.date); return d>=mon&&d<addDays(mon,7); });
  const doneP=wp.filter(p=>p.date<=tk&&acts.some(a=>a.date.slice(0,10)===p.date&&a.sport===p.sport));
  const missed=wp.filter(p=>p.date<tk&&!doneP.includes(p));
  const remaining=wp.filter(p=>p.date>tk||(p.date===tk&&!doneP.includes(p)));
  if(wp.length) lines.push(t(`Planning : ${doneP.length}/${wp.length} séance(s) faite(s)${missed.length?`, ${missed.length} manquée(s)`:""}${remaining.length?`, ${remaining.length} à venir`:""}.`,`Plan: ${doneP.length}/${wp.length} session(s) done${missed.length?`, ${missed.length} missed`:""}${remaining.length?`, ${remaining.length} to come`:""}.`));
  const remMin=remaining.reduce((s,p)=>s+(+p.dur||0),0);
  if(remMin){ const proj=h+remMin/60; lines.push(t(`Avec les séances restantes, tu finirais vers ${proj.toFixed(1).replace(".",DEC())} h${S.set.goalH?` (objectif ${S.set.goalH} h)`:""}.`,`With the remaining sessions you'd finish around ${proj.toFixed(1)} h${S.set.goalH?` (goal ${S.set.goalH} h)`:""}.`)); }
  let verdict=stateSentence(st,m);
  if((st.k==="over"||st.k==="build")){ const hardRem=remaining.filter(p=>p.int==="intense"); if(hardRem.length>(st.k==="over"?0:1)) verdict+=" "+t(`Passe « ${hardRem[0].title} » (${dayName(hardRem[0].date)}) en facile.`,`Make “${hardRem[0].title}” (${dayName(hardRem[0].date)}) easy.`); }
  if(st.k==="low"&&!remaining.length&&dayIdx<5) verdict+=" "+t("Rien n'est prévu d'ici dimanche : « Proposer ma semaine » peut t'aider.","Nothing planned before Sunday: “Suggest my week” can help.");
  return {st,m,lines,verdict,cur,remaining,missed,hardN,h};
}

async function genWeek(off){
  const mon=addDays(startOfWeek(today0()),off*7); const keys=[0,1,2,3,4,5,6].map(i=>dayKey(addDays(mon,i)));
  if(S.plans.some(p=>p.prog&&keys.includes(p.date))){ toast(t("Cette semaine suit ton programme : modifie directement les séances.","This week follows your training plan: edit the sessions directly.")); return 0; }
  const gen=applyRaces(suggestWeek(mon,ACTS()),{add:false}).filter(p=>p.date>=dayKey(today0()));
  if(!gen.length){ toast(t("Cette semaine est passée : avance d'une semaine pour planifier.","This week is over: move ahead a week to plan.")); return 0; }
  for(const p of S.plans.filter(p=>p.gen&&keys.includes(p.date)&&p.date>=dayKey(today0()))) await delPlan(p.id);
  for(const p of gen) await putPlan({...p,id:"p"+uid()});
  toast(t(`${gen.length} séances proposées. Touche une séance pour l'ajuster.`,`${gen.length} sessions suggested. Tap a session to adjust it.`));
  return gen.length;
}
const SPORT_WORDS={velo:["velo","cycling","cyclisme","bike","biking","vtt","ride","gravel"],course:["course a pied","running","run ","runs","footing","jogging","courir","course"],natation:["natation","swim","nage","nager","piscine"],renfo:["renfo","strength","muscu","musculation","calisthen","gainage","force"],basket:["basket"]};
function currentPerWeek(sp){ const td=today0(); const n=ACTS().filter(a=>a.sport===sp&&parseDay(a.date)>=addDays(td,-27)).length; return Math.round(n/4); }
function parseTargetRequest(q){
  const x=" "+norm(q).replace(/[?!.,;:]/g," ")+" ";
  const sports=Object.keys(SPORT_WORDS).filter(k=>SPORT_WORDS[k].some(w=>x.includes(w)));
  if(!sports.length) return null;
  const none=/ sans | without | remove | enleve | retire | supprime | no more | stop /.test(x);
  const more=/ more | davantage | ajoute | ajouter | add | include | inclure | inclus | increase | augmente | plus de /.test(x);
  const less=/ moins | less | fewer | reduce | reduis | diminue /.test(x);
  const W={un:1,une:1,one:1,deux:2,two:2,trois:3,three:3,quatre:4,four:4,cinq:5,five:5,six:6};
  let n=null; const m=x.match(/(\d+)\s*(?:x|fois|seances?|sessions?|times|sorties?|entrainements?|workouts?)\s/);
  if(m&&+m[1]<=7) n=+m[1];
  if(n==null){ const w=x.match(/ (un|une|one|deux|two|trois|three|quatre|four|cinq|five|six) (?:seances?|sessions?|sorties?|fois|times|workouts?|entrainements?) /); if(w) n=W[w[1]]; }
  const weekly=/semaine|week|hebdo|plan|planning|programme|schedule/.test(x);
  if(n==null&&!more&&!less&&!none) return null;
  if(n!=null&&!weekly&&!more) return null;
  if(n==null&&!weekly&&!none) return null;
  const out={};
  for(const sp of sports){ const cur=(S.set.targets||{})[sp]??currentPerWeek(sp);
    out[sp]= n!=null&&!more ? n : n!=null&&more ? Math.min(7,cur+n) : none ? 0 : more ? Math.min(7,cur+1) : Math.max(0,cur-1); }
  return out;
}
function applyTargets(tg){
  const before={...(S.set.targets||{})}; S.set.targets={...before,...tg}; saveSettings();
  const parts=Object.entries(tg).map(([k,v])=>{ const was=before[k]??currentPerWeek(k); return v===0?t(`${SPORTS[k].l.toLowerCase()} retiré`,`${SPORTS[k].l.toLowerCase()} removed`):t(`${SPORTS[k].l.toLowerCase()} : ${v} séance${v>1?"s":""} par semaine (avant ~${was})`,`${SPORTS[k].l.toLowerCase()}: ${v} session${v>1?"s":""} per week (was ~${was})`); });
  const W=analyzeWeek(ACTS(),PLANS());

/* doublons : même jour, même sport, même titre (ou deux séances de programme le même jour et dans le même sport) */
function findDuplicatePlans(){
  const cid=S.set.prog||PROG_ID;
  const rank=p=>p.prog===cid?0:(!p.prog&&!p.gen)?1:p.prog?2:3;
  const list=S.plans.filter(p=>!String(p.id).startsWith("dp")).sort((a,b)=>rank(a)-rank(b)||String(a.id).localeCompare(String(b.id)));
  const seen=new Set(), progDay=new Set(), dups=[];
  for(const p of list){
    const k=`${p.date}|${p.sport}|${norm(p.title||"")}`;
    if(seen.has(k)){ dups.push(p); continue; }
    if(p.prog&&p.prog!==cid&&progDay.has(`${p.date}|${p.sport}`)){ dups.push(p); continue; }
    seen.add(k); if(p.prog) progDay.add(`${p.date}|${p.sport}`);
  }
  return dups;
}

    ${todays.length?`<div class="stack" style="gap:8px">${todays.map(p=>planItem(p)).join("")}</div>`:`<div class="empty">${t("Aujourd'hui : repos complet. Marche ou vélotaf tranquille seulement.","Today: full rest. Easy walk or commute only.")}</div>`}

/* séances types d'une semaine, avec poids (part du budget), priorité (1 = indispensable) et bornes */
function tplSessions(cfg,ph){
  const T=TPLS[cfg.tpl], L=cfg.level, C=T.cap, out=[];
  const S_=(sport,role,w,prio,min,max,hard=false)=>out.push({sport,role,w,prio,min,max,hard});
  const noStr=(cfg.extras||[]).some(x=>x.sport==="renfo"&&x.days.length);
  if(T.kind==="run"){
    S_("course","long",cfg.tpl==="run_marathon"?.33:.3,1,40,C.course);
    S_("course","key",.2,2,35,80,true);
    S_("course","easy",.15,3,30,60);
    if(!noStr) S_("renfo","str",.07,4,25,40);
    if(L>=1) ph==="base"||ph==="rec"?S_("course","strides",.12,5,30,55):S_("course","key2",.14,5,35,75,cfg.tpl!=="run_marathon");
    if(L>=1) S_("course","easy",.11,6,30,60);
    if(L>=2) S_("course","recov",.08,7,25,45);
  } else if(T.kind==="bike"){
    S_("velo","long",.42,1,60,C.velo);
    S_("velo","key",.2,2,45,90,true);
    S_("velo","easy",.18,3,45,90);
    if(!noStr) S_("renfo","str",.06,4,25,40);
    if(L>=1) S_("velo","tempo",.14,5,45,90);
  } else {
    const long=cfg.tpl==="tri_703"||cfg.tpl==="ironman";
    S_("velo","long",long?.3:.24,1,45,C.velo);
    S_("course","long",long?.17:.15,1,35,C.course);
    S_("natation","tech",.09,2,30,C.natation);
    S_("velo","key",.13,3,40,90,true);
    S_("course","key",.1,4,30,70,true);
    S_("natation","swim",.1,5,30,C.natation);

    if(long||L>=2) S_("natation","swim3",.06,8,30,C.natation);
    if(!noStr) S_("renfo","str",.04,9,25,35);
  }
  return out;
}

/* génération complète : semaines, phases, budget, placement des séances dans les jours disponibles */
const TPL_CACHE={};
function tplBuild(cfg){
  const key=JSON.stringify(cfg)+LANG+(S.set.defTime||"");
  if(TPL_CACHE.k===key) return TPL_CACHE.v;
  const T=TPLS[cfg.tpl], race=parseDay(cfg.race), raceMon=startOfWeek(race);
  let start=parseDay(cfg.start||dayKey(startOfWeek(today0())));
  let N=Math.round((raceMon-start)/(7*864e5))+1;
  if(N>T.max){ start=addDays(raceMon,-(T.max-1)*7); N=T.max; }
  const warn=[];
  if(N<T.min) warn.push(t(`Préparation courte : ${N} semaine(s) au lieu de ${T.min} minimum conseillées. Le programme est compressé, reste prudent.`,`Short build: ${N} week(s) instead of the recommended ${T.min}. The plan is compressed, stay careful.`));
  const items=[], weeks=[], tm=S.set.defTime||"18:00";
  const nT=Math.max(0,Math.min(T.taper,N-3)), M=Math.max(0,N-1-nT);
  const s0=[.6,.7,.75][cfg.level]??.7;
  const avail=cfg.avail.map(x=>+x||0), extras=(cfg.extras||[]).filter(x=>x.days&&x.days.length);
  const exMin=extras.reduce((s,x)=>s+x.dur*x.days.length,0);
  let rest=avail.map((a,i)=>a?null:i).filter(x=>x!=null);
  const forcedRest=rest.length?null:(cfg.longDay+1)%7;
  if(forcedRest!=null){ rest=[forcedRest]; }
  const longDay=cfg.longDay, longDay2=avail.map((a,i)=>[a,i]).filter(([a,i])=>i!==longDay&&i!==forcedRest).sort((x,y)=>y[0]-x[0]||Math.abs(x[1]-longDay)-Math.abs(y[1]-longDay))[0]?.[1];
  let skipped=0, short=0;
  const P=(d,sport,c,dur,time)=>items.push({date:dayKey(d),time:time||(([5,6].includes((d.getDay()+6)%7))?"09:00":tm),sport,title:c.title,dur:r5(dur),int:c.int,notes:c.notes,zone:c.zone??null,gen:false});
  const phCount={};
  for(let w=1;w<=N-1;w++){
    const i=w-1, mon=addDays(start,i*7);
    let ph, f;
    if(i<M){ f=s0+(1-s0)*(M>1?i/(M-1):1); ph=i<M*.4?"base":i<M*.75?"build":"peak"; if((i+1)%4===0&&i<M-1){ f*=.7; ph="rec"; } }
    else { ph="taper"; f=nT-(i-M)>1?.75:.6; }
    const k=phCount[ph]=(phCount[ph]??-1)+1;
    const budget=Math.max(0,cfg.hours*60*f-exMin);
    let sess=tplSessions(cfg,ph==="taper"?"peak":ph).map(s=>({...s}));
    if(ph==="taper") sess=sess.filter(s=>s.prio<=6);
    if(ph==="taper"||ph==="rec") sess.forEach(s=>{ s.min=Math.max(20,Math.round(s.min*.7)); });
    // durée cible = part du budget, bornée ; on retire les moins prioritaires si le budget ne suffit pas
    const sized=()=>{ const sw=sess.reduce((a,s)=>a+s.w,0); sess.forEach(s=>{ let cap=s.max; if(s.role==="long") cap=s.min+(s.max-s.min)*Math.min(1,f*(ph==="base"?.75:ph==="build"?.9:1)); s.dur=Math.max(s.min,Math.min(cap,budget*s.w/sw)); }); return sess.reduce((a,s)=>a+s.dur,0); };
    while(sized()>budget*1.08&&sess.length>2&&sess[sess.length-1].prio>2){ sess.sort((a,b)=>a.prio-b.prio); sess.pop(); }
    // placement
    const cap=avail.slice(); rest.forEach(d=>cap[d]=0);
    const day=[[],[],[],[],[],[],[]], hard=[0,0,0,0,0,0,0], isLong=[0,0,0,0,0,0,0];
    for(const x of extras) for(const d of x.days){ day[d].push({sport:x.sport,extra:1}); cap[d]=Math.max(0,cap[d]-x.dur); if(x.int==="intense") hard[d]=1;
      P(addDays(mon,d),x.sport,{title:`${SPORTS[x.sport].l} (${hm(x.dur)})`,int:x.int,zone:null,notes:t("Autre sport choisi dans ton programme : il compte dans ta charge de la semaine.","Other sport chosen in your plan: it counts toward your weekly load.")},x.dur); }
    sess.sort((a,b)=>a.prio-b.prio||(b.role==="long")-(a.role==="long"));
    let weekKey="";
    for(const s of sess){
      let best=-1, bs=-1e9;
      for(let d=0;d<7;d++){
        if(cap[d]<s.min) continue;
        const mine=day[d].filter(x=>!x.extra);
        if(mine.length>=2||day[d].some(x=>x.sport===s.sport)) continue;
        let sc=Math.min(cap[d],s.dur)/6-day[d].length*14;
        if(cap[d]<s.dur) sc-=25;
        if(s.role==="long"){ sc+=d===longDay?120:d===longDay2?45:0; if(isLong[d]) sc-=80; if(d>0&&hard[d-1]) sc-=20; }
        if(s.hard){ if(hard[d]||isLong[d]) sc-=70; if((d>0&&hard[d-1])||(d<6&&hard[d+1])) sc-=45; if(d<6&&isLong[d+1]) sc-=35; if(d>0&&isLong[d-1]) sc-=15; if(d===longDay||d===longDay2) sc-=40; }

      P(addDays(mon,best),s.sport,c,dur);

      if(T.kind==="tri"&&s.role==="long"&&s.sport==="velo"&&(ph==="build"||ph==="peak")&&cap[best]>=10&&!day[best].some(x=>x.sport==="course")){
        const bd=Math.min(cap[best],ph==="peak"?25:15); cap[best]-=bd; day[best].push({sport:"course"});

      }
    }
    const planned=items.filter(p=>{ const k2=p.date; return k2>=dayKey(mon)&&k2<=dayKey(addDays(mon,6)); }).reduce((a,p)=>a+p.dur,0);
    weeks.push({w,mon:dayKey(mon),ph,label:PH_L()[ph],min:planned,key:weekKey});
  }
  // semaine de course : séances d'activation calées sur la date de la course
  const cut=dayKey(addDays(race,-5));
  for(let i=items.length-1;i>=0;i--) if(items[i].date>=cut) items.splice(i,1);
  const rw=(off,sport,title,dur,int,zone,notes)=>{ const d=addDays(race,off); if(d<start) return; const dw=(d.getDay()+6)%7; if(off<0&&!avail[dw]) return; P(d,sport,{title,int,zone,notes},off<0?Math.min(dur,avail[dw]):dur); };
  const rn=cfg.name||tplName(cfg.tpl);
  if(T.kind==="run"){
    rw(-5,"course",t("Rappel : 4 × 3 min allure course, récup 2 min","Sharpener: 4 × 3 min at race pace, 2 min recovery"),40,"modere","2+4",t("Semaine de course : volume réduit, un peu de rythme pour rester vif.","Race week: reduced volume, a little pace to stay sharp."));
    rw(-3,"course",t("Footing 30 min + 4 lignes droites","30 min easy + 4 strides"),35,"facile","2",t("Très facile.","Very easy."));
    rw(-1,"course",t("Déblocage 20 min + 3 accélérations","20 min shake-out + 3 accelerations"),20,"facile","1-2",t("Veille de course : court et facile. Prépare tes affaires et ton dossard.","Day before: short and easy. Get your kit and bib ready."));
  } else if(T.kind==="bike"){
    rw(-5,"velo",t("Vélo rappel : 3 × 5 min allure tempo","Bike sharpener: 3 × 5 min tempo"),60,"modere","2+3",t("Semaine de l'objectif : volume réduit.","Event week: reduced volume."));
    rw(-3,"velo",t("Vélo souple 45 min","Easy spin 45 min"),45,"facile","1-2",t("Vérifie le vélo (pneus, freins, transmission).","Check your bike (tyres, brakes, drivetrain)."));
    rw(-1,"velo",t("Déblocage 30 min + 3 accélérations","30 min spin + 3 accelerations"),30,"facile","1-2",t("Prépare ravitaillement et parcours.","Prepare food, drinks and route."));
  } else {
    rw(-5,"natation",t("Natation : 6 × 100 m allure course","Swim: 6 × 100 m at race pace"),35,"modere","2-3",t("Semaine de course : volume réduit.","Race week: reduced volume."));
    rw(-4,"velo",t("Vélo 45 min dont 3 × 3 min allure course","Bike 45 min incl. 3 × 3 min at race pace"),45,"modere","2+4",t("Le reste très facile.","The rest very easy."));
    rw(-3,"course",t("Footing 25 min + 4 lignes droites","25 min easy + 4 strides"),25,"facile","2",t("Très facile.","Very easy."));
    rw(-1,"velo",t("Activation : vélo 20 min + course 10 min","Openers: 20 min bike + 10 min run"),30,"facile","1-2",t("Prépare ton sac de transition, vérifie le vélo.","Pack your transition bag, check your bike."));
  }
  P(race,T.kind==="tri"?"autre":T.kind==="bike"?"velo":"course",{title:`${rn.toUpperCase()} — ${T.dist}`,int:"intense",zone:T.kind==="bike"?"2-3":"4",notes:t("Jour J : départ prudent, mange et bois selon ce que tu as testé à l'entraînement. Bonne course !","Race day: start conservatively, eat and drink as tested in training. Have a great race!")},T.race,"09:00");
  weeks.push({w:N,mon:dayKey(raceMon),ph:"race",label:PH_L().race,min:items.filter(p=>p.date>=dayKey(raceMon)).reduce((a,p)=>a+p.dur,0),key:rn});
  if(skipped) warn.push(t(`${skipped} séance(s) n'ont pas trouvé de créneau sur l'ensemble du programme : ajoute du temps certains jours si tu peux.`,`${skipped} session(s) found no slot across the plan: add time on some days if you can.`));
  if(short) warn.push(t(`${short} séance(s) raccourcie(s) pour tenir dans tes créneaux.`,`${short} session(s) shortened to fit your slots.`));
  if(exMin>=cfg.hours*60*.6) warn.push(t("Tes autres sports prennent l'essentiel de ton temps : le programme dispose de peu de minutes.","Your other sports take most of your time: the plan has few minutes left."));

Programme de ${B.N} semaines à partir du ${fmtDate(parseDay(B.start))} : fondation, développement, spécifique, affûtage, avec une semaine allégée toutes les 4 semaines.

${exTxt?`Autres sports à garder : ${exTxt}. Ils comptent dans la charge : pas de séance clé le lendemain d'un sport intense.\n`:""}Règles : une seule séance dure par sport et par semaine (deux maximum pour les confirmés), 80 % du temps en endurance facile, alléger si fatigue, sommeil perturbé ou FC repos +5 bpm.`,

/* ============ compétitions prévues ============
   Chaque compétition (S.set.races) modifie le planning autour de sa date :

  tri_m:{s:"autre",fr:"Triathlon M",en:"Olympic triathlon",dur:150,rec:5},
  tri_703:{s:"autre",fr:"Half Ironman 70.3",en:"Half Ironman 70.3",dur:360,rec:9},
  ironman:{s:"autre",fr:"Ironman",en:"Ironman",dur:780,rec:16},
  bike:{s:"velo",fr:"Course vélo / cyclosportive",en:"Bike race / sportive",dur:240,rec:null},
  swim:{s:"natation",fr:"Natation / eau libre",en:"Swim / open water",dur:60,rec:1},

const RACE_PRIO=()=>({A:t("A — objectif majeur (7 j d'affûtage)","A — main goal (7-day taper)"),B:t("B — importante (3 j allégés)","B — important (3 lighter days)"),C:t("C — préparation (veille facile)","C — tune-up (easy day before)")});
const raceTypeName=k=>RACE_TYPES[k]?t(RACE_TYPES[k].fr,RACE_TYPES[k].en):"";
const raceName=r=>r.name||raceTypeName(r.type);
function raceList(){ return (S.set.races||[]).filter(r=>r&&r.id&&r.date&&RACE_TYPES[r.type]).sort((a,b)=>a.date.localeCompare(b.date)); }
function raceRecDays(r){
  const T=RACE_TYPES[r.type], d=+r.dur||T.dur;
  let n;
  if(T.rec!=null) n=Math.round(T.rec*Math.sqrt(d/T.dur));
  else if(T.s==="velo") n=d<=120?1:d<=300?3:4;
  else if(T.s==="natation") n=1;
  else n=d<=35?2:d<=75?3:d<=130?5:d<=200?8:d<=400?11:16;
  if(r.prio==="C") n=Math.ceil(n*.6);
  return Math.max(1,n);
}

const isLongP=p=>/sortie longue|long run|long ride|footing long|steady run/i.test(p.title||"");
function easyTitle(sport,dur){
  const D=hm(dur);
  return sport==="course"?t(`Footing EF ${D}`,`Easy run ${D}`):sport==="velo"?t(`Vélo endurance ${D}`,`Endurance ride ${D}`):sport==="natation"?t(`Natation souple ${D}`,`Easy swim ${D}`):sport==="renfo"?t(`Renfo léger ${D}`,`Light strength ${D}`):`${SPORTS[sport].l} ${t("facile","easy")} ${D}`;
}
/* applique toutes les compétitions à une liste de séances planifiées.
   add : ajoute la course, l'activation de la veille (et une récup en mode autonome) */
function applyRaces(items,{add=true,standalone=false}={}){
  let out=items.slice();
  for(const r of raceList()){
    const T=RACE_TYPES[r.type], rd=parseDay(r.date), pre=racePre(r), rec=raceRecDays(r), nm=raceName(r), dur=+r.dur||T.dur;
    const tag=t(` Ajusté pour : ${nm}.`,` Adjusted for: ${nm}.`);
    const off=p=>Math.round((parseDay(p.date)-rd)/864e5);
    const ed=(p,o)=>({...p,...o,notes:((p.notes||"")+(String(p.notes||"").includes(tag.trim())?"":tag)).trim()});
    out=out.flatMap(p=>{
      if(p.race) return [p];
      const o=off(p);
      if(o===0) return []; // la course remplace les séances du jour
      if(o<0&&o>=-pre){
        if(o===-1){ if(r.prio!=="C") return []; return isHardP(p)||isLongP(p)?[ed(p,{title:easyTitle(p.sport,r5(Math.min(p.dur,40))),dur:r5(Math.min(p.dur,40)),int:"facile",zone:p.sport==="renfo"?null:"1-2"})]:[p]; }
        if(dur>=60&&o>=-3&&isLongP(p)&&(p.sport===T.s||T.s==="autre")) return []; // la course tient lieu de sortie longue
        if(p.sport==="renfo"&&o>=-2) return [];
        if(isHardP(p)) return [ed(p,{title:t(`${SPORTS[p.sport].l} — rappel : 4 × 2 min allure course`,`${SPORTS[p.sport].l} — sharpener: 4 × 2 min at race pace`),dur:r5(Math.min(p.dur*.6,45)),int:"modere",zone:p.sport==="renfo"?null:"2+4"})];
        if(isLongP(p)){ const d=r5(p.dur*.6); return [ed(p,{title:easyTitle(p.sport,d),dur:d,int:"facile"})]; }
        if(r.prio==="A"){ const d=r5(p.dur*.75); return [ed(p,{dur:d})]; }
        return [p];
      }
      if(o>0&&o<=rec){
        if(o===1&&rec>=4) return [];
        if(p.sport==="renfo"&&o<=Math.min(3,rec)) return [];
        if(o===1) return isHardP(p)||isLongP(p)||p.dur>30?[ed(p,{title:t("Récup : ","Recovery: ")+easyTitle(p.sport,30),dur:30,int:"facile",zone:p.sport==="renfo"?null:"1-2"})]:[p];
        if(isHardP(p)||isLongP(p)){ const d=r5(p.dur*.7); return [ed(p,{title:easyTitle(p.sport,d),dur:d,int:"facile",zone:p.sport==="renfo"?null:"1-2"})]; }
        if(rec>=8&&o<=rec/2){ const d=r5(p.dur*.7); return [ed(p,{dur:d})]; }
        return [p];
      }
      return [p];
    });
    if(add){
      const R=(o,sport,title,d,int,zone,notes,time)=>out.push({date:dayKey(addDays(rd,o)),time:time||S.set.defTime||"18:00",sport,title,dur:d,int,zone,notes,race:r.id,gen:false});
      R(0,T.s,`🏁 ${nm}`,dur,"intense",null,t(`Compétition (${raceTypeName(r.type)}, priorité ${r.prio}). Échauffement 10–15 min + quelques accélérations, départ prudent, mange et bois comme à l'entraînement.`,`Race (${raceTypeName(r.type)}, priority ${r.prio}). Warm up 10–15 min + a few strides, start conservatively, fuel as in training.`),r.time||"09:00");
      if(r.prio!=="C") R(-1,T.s==="autre"?"course":T.s,t("Activation veille de course : 20 min + 3 accélérations","Pre-race opener: 20 min + 3 accelerations"),20,"facile","1-2",t(`Veille de ${nm} : court et facile. Prépare tes affaires.`,`Day before ${nm}: short and easy. Get your kit ready.`));
      if(standalone&&rec>=2) R(rec>=4?2:1,T.s==="velo"?"natation":"velo",t("Récupération active 30 min très facile","Active recovery 30 min very easy"),30,"facile","1",t(`Après ${nm} : faire tourner les jambes sans forcer. Reprise des séances intenses dans ${rec} jours.`,`After ${nm}: spin the legs gently. Hard sessions resume in ${rec} days.`));
    }
  }
  return out;
}

/* resynchronise le planning après ajout / modification / suppression d'une compétition */
async function raceSync(adaptManual){
  const tk=dayKey(today0());
  if(curProg()) await progLoad("mine",curProg(),true);
  else {
    const n={}, want=applyRaces([],{add:true,standalone:true}).filter(p=>p.date>=tk).map(p=>{ const k=`${p.date}-${p.sport}`; n[k]=(n[k]||0)+1; return {...p,id:`race-${p.race}-${k}-${n[k]}`}; });
    const ids=new Set(want.map(p=>p.id));
    for(const p of S.plans.filter(p=>p.race&&!p.prog&&p.date>=tk&&!ids.has(p.id))) await delPlan(p.id);
    for(const p of want) await putPlan(p);
  }
  // séances proposées automatiquement (et, si demandé, celles ajoutées à la main)
  const pool=S.plans.filter(p=>p.date>=tk&&!p.prog&&!p.race&&!String(p.id).startsWith("dp")&&(p.gen||adaptManual));
  const adj=applyRaces(pool,{add:false}), keep=new Map(adj.map(p=>[p.id,p]));
  let changed=0;
  for(const p of pool){ const q=keep.get(p.id); if(!q){ await delPlan(p.id); changed++; } else if(q.dur!==p.dur||q.title!==p.title||q.int!==p.int){ await putPlan(q); changed++; } }
  const left=adaptManual?0:raceManualHits().length;
  render(); return {changed,left};
}
/* séances manuelles qui tombent dans la fenêtre d'une compétition et seraient modifiées */
function raceManualHits(){
  const tk=dayKey(today0()), pool=S.plans.filter(p=>p.date>=tk&&!p.prog&&!p.race&&!p.gen&&!String(p.id).startsWith("dp"));
  const adj=new Map(applyRaces(pool,{add:false}).map(p=>[p.id,p]));
  return pool.filter(p=>{ const q=adj.get(p.id); return !q||q.dur!==p.dur||q.title!==p.title; });
}

const NK="forma-notified";
const notifSupported=()=>!!window.__STANDALONE && "Notification" in window;
let notifTimers=[];
async function showNotif(title,body,tag){
  try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(reg) return reg.showNotification(title,{body,tag,icon:"icon-192.png",badge:"icon-192.png"}); new Notification(title,{body,tag,icon:"icon-192.png"}); }catch(e){}
}
function scheduleNotifs(){
  notifTimers.forEach(clearTimeout); notifTimers=[];
  if(!notifSupported()||!S.set.notifOn||Notification.permission!=="granted"||pushActive()) return;
  const lead=(+S.set.notifLead||30)*60e3, now=Date.now();
  let sent={}; try{ sent=JSON.parse(localStorage.getItem(NK)||"{}"); }catch(e){}
  for(const p of S.plans){
    const time=p.time||S.set.defTime||"18:00"; const start=new Date(`${p.date}T${time}`).getTime(); const key=`${p.id}@${p.date}T${time}`;
    if(sent[key]||isNaN(start)||start<now) continue;
    const delay=Math.max(0,start-lead-now); if(delay>864e5) continue;
    notifTimers.push(setTimeout(()=>{
      showNotif(t(`${time} : ${p.title}`,`${time}: ${p.title}`),`${SPORTS[p.sport].l} · ${p.dur} min · ${INT()[p.int]||""}`,key);
      sent[key]=1; try{ localStorage.setItem(NK,JSON.stringify(sent)); }catch(e){}
    },delay));
  }
}

/* ---- notifications push : rappels même app fermée (serveur Netlify) ---- */
const PUSH_ID_K="forma-push-id", PUSH_ON_K="forma-push-on";
const pushSupported=()=>!!window.__STANDALONE && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function pushOn(){ try{ return localStorage.getItem(PUSH_ON_K)==="1"; }catch(e){ return false; } }
function pushActive(){ return pushSupported()&&pushOn()&&Notification.permission==="granted"; }
function pushId(){ let id=null; try{ id=localStorage.getItem(PUSH_ID_K); }catch(e){}
  if(!/^[a-f0-9]{32}$/.test(id||"")){ id=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join(""); try{ localStorage.setItem(PUSH_ID_K,id); }catch(e){} }
  return id; }
function b64uToU8(s){ const b=atob((s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
async function pushSubscription(){
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub){
    const r=await fetch("/.netlify/functions/push"); if(!r.ok) throw {code:"fn"};
    const {publicKey}=await r.json();
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(publicKey)});
  }
  return sub;
}
function buildReminders(){
  const out=[], now=Date.now(), td=today0();
  const plans=S.plans.filter(p=>!String(p.id).startsWith("dp"));
  if(S.set.notifEve!==false){
    const [hh,mm]=(S.set.eveTime||"20:00").split(":").map(Number);
    for(let i=0;i<=21;i++){
      const day=addDays(td,i), k=dayKey(day);
      const ps=plans.filter(p=>p.date===k).sort((a,b)=>(a.time||S.set.defTime||"").localeCompare(b.time||S.set.defTime||""));
      if(!ps.length) continue;
      const at=addDays(day,-1); at.setHours(hh||20,mm||0,0,0);
      if(at.getTime()<now-2.8*3600e3) continue;
      const tot=ps.reduce((s,p)=>s+(+p.dur||0),0);
      out.push({at:at.toISOString(),tag:`eve-${k}-${ps.map(p=>p.id).join("").slice(0,40)}`,
        title:t(`Demain : ${ps.length} séance${ps.length>1?"s":""} (${fmtDur(tot*60)})`,`Tomorrow: ${ps.length} session${ps.length>1?"s":""} (${fmtDur(tot*60)})`),
        body:ps.map(p=>`${p.time||S.set.defTime||"18:00"} · ${p.title} · ${p.dur} min${p.int==="intense"?" · "+t("intense","hard"):""}`).join("\n")+(S.set.notifEveTip!==false?"\n"+eveTip(ps):"")});
    }
  }
  if(S.set.notifOn){
    const lead=(+S.set.notifLead||30)*60e3;
    for(const p of plans){
      const time=p.time||S.set.defTime||"18:00", st=new Date(`${p.date}T${time}`).getTime();
      if(isNaN(st)||st<now||st>now+21*864e5) continue;
      out.push({at:new Date(st-lead).toISOString(),tag:`s-${p.id}-${p.date}T${time}`,title:t(`${time} : ${p.title}`,`${time}: ${p.title}`),body:`${SPORTS[p.sport].l} · ${p.dur} min · ${INT()[p.int]||""}`});
    }
  }
  return out.sort((a,b)=>a.at.localeCompare(b.at)).slice(0,200);
}
function eveTip(ps){
  const st=loadState(metrics(ACTS()));
  if(ps.some(p=>p.int==="intense")) return st.k==="over"?t("Fatigue élevée : passe la séance intense en facile.","High fatigue: make the hard session easy."):t("Séance clé demain : dîne bien et couche-toi tôt.","Key session tomorrow: eat well and get to bed early.");
  return t("Prépare tes affaires ce soir.","Get your kit ready tonight.");
}
let pushSig="", pushDeb=null;
function syncPushSoon(){ clearTimeout(pushDeb); pushDeb=setTimeout(()=>syncPush(false),2500); }
async function syncPush(force){
  if(!pushActive()) return;
  if(S.mode==="db"&&!S.actsServer) return;
  const rem=buildReminders(), sig=JSON.stringify(rem);
  if(!force&&sig===pushSig) return true;
  try{
    const sub=await pushSubscription();
    const r=await fetch("/.netlify/functions/push",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"register",id:pushId(),sub:sub.toJSON(),reminders:rem})});
    if(!r.ok) throw {code:"fn"};
    pushSig=sig; S.pushErr=null; return true;
  }catch(e){ S.pushErr=e?.code||"sub"; return false; }
}

    try{ localStorage.setItem(PUSH_ON_K,"1"); }catch(e){}

function icsEsc(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1"); }
async function exportWeekIcs(){
  const mon=addDays(startOfWeek(today0()),S.weekOff*7), keys=[0,1,2,3,4,5,6].map(i=>dayKey(addDays(mon,i)));
  const ps=PLANS().filter(p=>keys.includes(p.date));
  if(!ps.length){ toast(t("Aucune séance planifiée cette semaine.","No sessions planned this week.")); return; }
  const lead=+S.set.notifLead||30, stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const fmt=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Forma//Training//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  for(const p of ps){
    const s=new Date(`${p.date}T${p.time||S.set.defTime||"18:00"}`), e=new Date(s.getTime()+(+p.dur||45)*60e3);
    L.push("BEGIN:VEVENT",`UID:${p.id}-${p.date}@forma`,`DTSTAMP:${stamp}`,`DTSTART:${fmt(s)}`,`DTEND:${fmt(e)}`,`SUMMARY:${icsEsc(p.title)}`,
      `DESCRIPTION:${icsEsc(`${SPORTS[p.sport].l} · ${p.dur} min · ${INT()[p.int]||""}${planZone(p)?" · "+zoneTxt(planZone(p)):""}${p.notes?"\n"+p.notes:""}`)}`,
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(p.title)}`,`TRIGGER:-PT${lead}M`,"END:VALARM","END:VEVENT");
  }
  L.push("END:VCALENDAR");
  const text=L.join("\r\n"), filename=`forma-${t("semaine","week")}-${isoWeek(mon)}.ics`;
  if(S.dl){ try{ const r=await S.dl.save({filename,data:text}); if(r&&r.status==="saved") toast(t("Fichier calendrier enregistré : ouvre-le pour ajouter les séances.","Calendar file saved: open it to add the sessions.")); }catch(e){ toast(t("Export impossible.","Export failed.")); } return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/calendar"})); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  toast(t(`${ps.length} séance(s) exportée(s) avec rappel ${lead} min avant.`,`${ps.length} session(s) exported with a reminder ${lead} min before.`));
}

/* ============ graphiques ============ */
function baseOpts(){
  const tick=cssVar("--muted"), grid=cssVar("--line");
  return {responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{display:false},tooltip:{backgroundColor:cssVar("--btn"),titleColor:cssVar("--btn-ink"),bodyColor:cssVar("--btn-ink"),titleFont:{family:"IBM Plex Mono"},bodyFont:{family:"IBM Plex Mono"}}},
    scales:{x:{ticks:{color:tick,font:{family:"IBM Plex Mono",size:10.5},maxRotation:0,autoSkipPadding:12},grid:{display:false},border:{color:grid}},
            y:{ticks:{color:tick,font:{family:"IBM Plex Mono",size:10.5}},grid:{color:grid},border:{display:false}}}};
}
/* ---- période des graphiques ---- */
const RANGE_K="forma-range";
const RANGES=[["28",()=>t("4 sem.","4 wk")],["56",()=>t("8 sem.","8 wk")],["91",()=>t("3 mois","3 mo")],["182",()=>t("6 mois","6 mo")],["365",()=>t("1 an","1 yr")],["all",()=>t("Tout","All")],["custom",()=>t("Dates…","Dates…")]];
S.range=(()=>{ try{ const r=JSON.parse(localStorage.getItem(RANGE_K)||"null"); if(r&&r.k) return r; }catch(e){} return {k:"91"}; })();
function saveRange(){ try{ localStorage.setItem(RANGE_K,JSON.stringify(S.range)); }catch(e){} }
function rangeBounds(){
  const td=today0(), r=S.range;
  if(r.k==="custom"&&r.from){ let a=parseDay(r.from), b=r.to?parseDay(r.to):td; if(b>td) b=td; if(a>b) [a,b]=[b,a]; return {start:a,end:b}; }
  if(r.k==="all"){ const acts=ACTS(); const first=acts.length?acts.reduce((m,x)=>x.date<m?x.date:m,acts[0].date).slice(0,10):dayKey(addDays(td,-90)); let a=parseDay(first); const lim=addDays(td,-1500); if(a<lim) a=lim; return {start:a,end:td}; }
  const n=parseInt(r.k)||91; return {start:addDays(td,-(n-1)),end:td};
}
function rangeLabel(){
  const {start,end}=rangeBounds(); const r=S.range;
  if(r.k!=="custom"&&r.k!=="all"){ const n=+r.k; return n<=56?t(`${n/7} semaines`,`${n/7} weeks`):n<365?t(`${Math.round(n/30.4)} mois`,`${Math.round(n/30.4)} months`):t("1 an","1 year"); }
  const y=d=>d.getFullYear()!==today0().getFullYear()?` ${d.getFullYear()}`:"";
  return `${fmtDate(start)}${y(start)} – ${fmtDate(end)}${y(end)}`;
}
function rangeBar(compact){
  const r=S.range;
  return `<div class="rangebar${compact?" compact":""}" role="group" aria-label="${t("Période des graphiques","Chart period")}">
    <div class="chips">${RANGES.map(([k,l])=>`<button class="chip" data-range="${k}" aria-pressed="${r.k===k}">${l()}</button>`).join("")}</div>
    ${r.k==="custom"?`<div class="row rg-dates"><label class="f"><span>${t("Du","From")}</span><input type="date" id="rg-from" max="${dayKey(today0())}" value="${r.from||dayKey(addDays(today0(),-90))}"></label><label class="f"><span>${t("Au","To")}</span><input type="date" id="rg-to" max="${dayKey(today0())}" value="${r.to||dayKey(today0())}"></label></div>`:""}
  </div>`;
}
/* regroupe par semaine, ou par mois au-delà d'environ 18 mois */
function buckets(){
  const {start,end}=rangeBounds(); const out=[];
  if((end-start)/864e5>540){
    let d=new Date(start.getFullYear(),start.getMonth(),1);
    while(d<=end){ const e=new Date(d.getFullYear(),d.getMonth()+1,1); out.push({s:d,e,label:`${MONTHS()[d.getMonth()]}${d.getMonth()===0||!out.length?" "+String(d.getFullYear()).slice(2):""}`}); d=e; }
  } else {
    let d=startOfWeek(start);
    while(d<=end){ out.push({s:d,e:addDays(d,7),label:`${t("S","W")}${isoWeek(d)}`}); d=addDays(d,7); }
  }
  return out;
}
const inB=(a,b)=>{ const d=parseDay(a.date); return d>=b.s&&d<b.e; };
function drawFormChart(id){

  charts[id]=new Chart(el,{data:{labels:ser.map(lab),datasets:[
    {type:"bar",label:t("Fraîcheur","Freshness"),data:ser.map(x=>+x.tsb.toFixed(1)),backgroundColor:cssVar("--s-natation")+"66",borderWidth:0,order:3},
    {type:"line",label:t("Forme","Fitness"),data:ser.map(x=>+x.ctl.toFixed(1)),borderColor:cssVar("--ink"),borderWidth:2.2,pointRadius:0,tension:.3,order:1},
    {type:"line",label:"Fatigue",data:ser.map(x=>+x.atl.toFixed(1)),borderColor:cssVar("--s-course"),borderWidth:1.6,pointRadius:0,tension:.3,order:2}
  ]},options:baseOpts()});
}
function weeksBack(n){ const mon=startOfWeek(today0()); return Array.from({length:n},(_,i)=>addDays(mon,-(n-1-i)*7)); }
function drawVolume(){
  const el=$("#c-vol"); if(!el||!window.Chart) return;
  const bk=buckets(); const acts=ACTS(); const monthly=bk.length&&(bk[0].e-bk[0].s)>8*864e5;
  const ds=SK.filter(k=>acts.some(a=>a.sport===k)).map(k=>({label:SPORTS[k].l,backgroundColor:cssVar(SPORTS[k].v),borderRadius:2,
    data:bk.map(b=>+(acts.filter(a=>a.sport===k&&inB(a,b)).reduce((s,a)=>s+a.dur,0)/3600).toFixed(2))}));
  const o=baseOpts(); o.scales.x.stacked=true; o.scales.y.stacked=true; o.scales.y.ticks.callback=v=>v+" h";
  if(S.set.goalH&&!monthly){ ds.push({type:"line",label:t("Objectif","Goal"),data:bk.map(()=>S.set.goalH),borderColor:cssVar("--muted"),borderDash:[4,4],borderWidth:1.2,pointRadius:0,stack:"goal"}); }
  charts.vol=new Chart(el,{type:"bar",data:{labels:bk.map(b=>b.label),datasets:ds},options:o});
}
function drawTrend(){
  const el=$("#c-trend"); if(!el||!window.Chart) return;
  const sp=S.evoSport, mt=S.evoMetric; const acts=ACTS().filter(a=>a.sport===sp).sort((a,b)=>a.date.localeCompare(b.date));
  const o=baseOpts(); const col=cssVar(SPORTS[sp].v); let data,labels,type="line",note="";
  if(mt==="dist"||mt==="time"){
    const bk=buckets(); labels=bk.map(b=>b.label); type="bar";
    data=bk.map(b=>{ const xs=acts.filter(a=>inB(a,b)); return mt==="dist"?+xs.reduce((s,a)=>s+(a.dist||0),0).toFixed(1):+(xs.reduce((s,a)=>s+a.dur,0)/3600).toFixed(2); });
    o.scales.y.ticks.callback=v=>v+(mt==="dist"?" km":" h");
  } else {
    const {start,end}=rangeBounds();
    const xs=acts.filter(a=>{ const d=parseDay(a.date); return d>=start&&d<=end; }).filter(a=>mt==="hr"?a.hr:(a.dist&&a.dur));
    labels=xs.map(a=>{const d=parseDay(a.date);return t(`${d.getDate()}/${d.getMonth()+1}`,`${d.getMonth()+1}/${d.getDate()}`);});
    data=xs.map(a=>{
      if(mt==="hr") return Math.round(a.hr);
      if(sp==="course") return +(a.dur/60/a.dist).toFixed(2);
      if(sp==="natation") return +(a.dur/(a.dist*10)/60).toFixed(2);
      return +(a.dist/(a.dur/3600)).toFixed(1);
    });
    if(mt==="speed"&&(sp==="course"||sp==="natation")){ o.scales.y.reverse=true; o.scales.y.ticks.callback=v=>`${Math.floor(v)}:${pad(Math.round((v%1)*60)%60)}`; note=t("Axe inversé : plus la courbe monte, plus tu vas vite. La moyenne glissante (trait épais) lisse les écarts entre séances faciles et intenses.","Inverted axis: the higher the curve, the faster you go. The rolling average (thick line) smooths out easy vs hard sessions."); }
    else note = mt==="hr" ? t("À allure égale, une FC moyenne qui baisse signale un gain d'endurance.","At the same pace, a falling average heart rate means improved endurance.") : t("Moyenne glissante sur 5 séances en trait épais.","Thick line: 5-session rolling average.");
    o.plugins.tooltip.callbacks={title:(it)=>xs[it[0].dataIndex]?.title||""};
  }
  const sets=[{label:t("Valeur","Value"),data,backgroundColor:col+(type==="bar"?"":"55"),borderColor:col,borderWidth:type==="bar"?0:1,pointRadius:type==="bar"?0:3,pointBackgroundColor:col,showLine:false,borderRadius:2}];

function similarPlans(p){
  if(!p||!p.date) return [];
  const wd=parseDay(p.date).getDay();
  return S.plans.filter(x=>x.id!==p.id&&x.date>p.date&&x.sport===p.sport&&parseDay(x.date).getDay()===wd&&!!x.prog===!!p.prog&&!String(x.id).startsWith("dp"));
}

async function runAI(){
  if(!S.sample||S.aiBusy) return;
  S.aiBusy=true; S.aiText=""; render();
  const acts=ACTS(), m=metrics(acts), td=today0();
  const weeks=weeksBack(6).map(w=>{ const xs=acts.filter(a=>parseDay(a.date)>=w&&parseDay(a.date)<addDays(w,7)); const by={}; xs.forEach(a=>{ by[a.sport]=by[a.sport]||{n:0,h:0,km:0}; by[a.sport].n++; by[a.sport].h+=a.dur/3600; by[a.sport].km+=a.dist||0; });
    return `S${isoWeek(w)} : `+Object.entries(by).map(([k,v])=>`${SPORTS[k].l} ${v.n}× ${v.h.toFixed(1)}h${v.km?` ${v.km.toFixed(1)}km`:""}`).join(", ")||"rien"; });
  const recent=[...acts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(a=>`${a.date.slice(0,10)} ${SPORTS[a.sport].l} ${fmtDur(a.dur)}${a.dist?" "+fmtKm(a.dist)+"km":""}${paceStr(a.sport,a)?" "+paceStr(a.sport,a):""}${a.hr?" FC"+Math.round(a.hr):""}${a.rpe?" RPE"+a.rpe:""}`);
  const upcoming=PLANS().filter(p=>p.date>=dayKey(td)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10).map(p=>`${p.date} ${SPORTS[p.sport].l} ${p.dur}min ${INT()[p.int]} « ${p.title} »`);
  const prompt=`Tu es un entraîneur multisport expérimenté (course, vélo, natation, renforcement, basket). ${t("Réponds en français, tutoiement, ton direct et concret.","Answer in English, addressing the athlete directly, in a direct and concrete tone.")}
Date du jour : ${dayKey(td)}.
Zones cardio : ${ZONES().map(z=>`Z${z.z} ${z.lo==null?"<"+(z.hi+1):z.lo+"–"+z.hi}`).join(", ")} bpm.
Athlète : FC max ${S.set.hrMax}, FC repos ${S.set.hrRest}, objectif ${S.set.goalH} h/semaine. Objectif principal : ${S.set.goal||"non précisé"}.
${S.set.context?`Contexte et programme de l'athlète (prioritaires) :\n${S.set.context}\n`:""}${racesCtx()}${progInfo()?`Position dans le programme « ${progInfo().name} » : semaine ${progInfo().w}/${progInfo().n}, phase ${progInfo().phase}, J-${progInfo().days} avant la course.\n`:""}Indicateurs : forme CTL ${m.ctl.toFixed(0)}, fatigue ATL ${m.atl.toFixed(0)}, fraîcheur TSB ${m.tsb.toFixed(0)}, ratio charge aiguë/chronique ${m.acwr?m.acwr.toFixed(2):"n/d"}, historique ${m.histDays} jours.
Volume des 6 dernières semaines :
${weeks.join("\n")}
12 dernières séances :
${recent.join("\n")}
Séances planifiées à venir :
${upcoming.join("\n")||"aucune"}

Donne 4 à 6 conseils personnalisés pour les 7 prochains jours : ajustements du planning, intensités, récupération, points de vigilance. Chaque conseil sur une ligne commençant par « – ». Cite des chiffres de ses données. 180 mots maximum, pas de titre, pas de markdown.`;
  try{
    const r=await S.sample(prompt,{modelTier:"default",onText:({text})=>{ S.aiText=text; const o=$("#ai-out"); if(o) o.textContent=text; }});
    S.aiText=r.text;
  }catch(e){
    if(e?.code==="not_granted"){ S.sample=null; S.aiText=""; }
    else S.aiText = e?.code==="rate_limited" ? t("Trop de demandes pour le moment. Réessaie dans quelques minutes.","Too many requests right now. Try again in a few minutes.") : t("L'analyse n'a pas abouti. Réessaie plus tard.","The analysis didn't complete. Try again later.");
  }
  S.aiBusy=false; render();
}

    case "prog-remove": if(!el.dataset.confirm){ el.dataset.confirm="1"; el.textContent=t("Confirmer le retrait","Confirm removal"); el.classList.add("danger"); break; } el.disabled=true; await progRemove(); break;
    case "ctx-default": S.set.context=(curProg()||legacyProg()).context; S.set.ctxAuto=S.set.context; saveSettings(); render(); toast(t("Contexte du programme remis.","Plan context restored.")); break;
    case "coach-gen": { el.disabled=true; const off=((today0().getDay()+6)%7)>=5?1:0; const n=await genWeek(off); if(n){ S.weekOff=off; S.tab="plan"; render(); } else el.disabled=false; break; }
    case "clear-week": {
      const mon=addDays(startOfWeek(today0()),S.weekOff*7); const keys=[0,1,2,3,4,5,6].map(i=>dayKey(addDays(mon,i)));
      const ps=S.plans.filter(p=>keys.includes(p.date)); if(!ps.length){ toast(t("Aucune séance planifiée cette semaine.","No sessions planned this week.")); break; }
      await delPlansUndoable(ps,t(`Semaine vidée : ${ps.length} séance(s) supprimée(s).`,`Week cleared: ${ps.length} session(s) deleted.`)); break; }
    case "wipe": $("#wipe-zone").innerHTML=`<span class="muted">${t(`Supprimer ${S.acts.length} activités et ${S.plans.length} séances ? C'est définitif.`,`Delete ${S.acts.length} activities and ${S.plans.length} sessions? This can't be undone.`)}</span><button class="btn small ghost" id="wipe-no">${t("Annuler","Cancel")}</button><button class="btn small danger" id="wipe-yes">${t("Tout effacer","Delete everything")}</button>`; break;
    case "wipe-no": render(); break;
    case "wipe-yes": { const st=$("#wipe-zone"); st.innerHTML=`<span class="muted">${t("Suppression…","Deleting…")}</span>`; for(const a of [...S.acts]) await delAct(a.id); for(const p of [...S.plans]) await delPlan(p.id); toast(t("Données effacées.","Data deleted.")); render(); break; }
  }
});
document.addEventListener("change",e=>{
  const id=e.target.id; const v=e.target.value;
  if(id==="r-type"||id==="r-dur"||id==="r-prio"){ raceFormRefresh(id); return; }
  if(id==="r-name"||id==="r-date"||id==="r-time"||id==="r-manual") return;
  if(id&&id.startsWith("wz-")){ wizChange(id,v,e.target); return; }
  if(id==="file-in"){ importFiles([...e.target.files]); e.target.value=""; return; }
  if(id==="evo-sport"){ S.evoSport=v; render(); return; }
  if(id==="evo-metric"){ S.evoMetric=v; render(); return; }
  if(id==="rg-from"||id==="rg-to"){ S.range={...S.range,k:"custom",[id==="rg-from"?"from":"to"]:v}; saveRange(); render(); return; }
  if(id==="s-lang"){ setLang(v); return; }
  if(id==="notif-on"){ setNotif(e.target.checked).then(()=>syncPush(true)); return; }
  if(id==="push-on"){ setPush(e.target.checked); return; }
  if(id==="notif-eve"){ S.set.notifEve=e.target.checked; saveSettings(); syncPush(true); toast(t("Rappel de la veille mis à jour.","Evening reminder updated.")); return; }
  if(id==="eve-time"){ S.set.eveTime=v||"20:00"; saveSettings(); syncPush(true); toast(t(`Rappel de la veille à ${S.set.eveTime}.`,`Evening reminder at ${S.set.eveTime}.`)); return; }
  if(id==="s-hrauto"){ S.set.hrAuto=e.target.checked; if(e.target.checked) applyAutoHr(); saveSettings(); render(); toast(t("Réglage cardio enregistré.","HR setting saved.")); return; }
  if(id==="notif-analysis"){ S.set.notifAnalysis=e.target.checked; saveSettings(); return; }
  if(id==="notif-lead"){ S.set.notifLead=+v; saveSettings(); scheduleNotifs(); syncPush(true); toast(t("Rappel mis à jour.","Reminder updated.")); return; }
  if(id==="s-deftime"){ S.set.defTime=v; saveSettings(); scheduleNotifs(); return; }
  if(id&&id.startsWith("tg-")){ const k=id.slice(3); const tg={...(S.set.targets||{})}; if(v==="") delete tg[k]; else tg[k]=Math.max(0,Math.min(7,parseInt(v)||0)); S.set.targets=tg; saveSettings(); toast(t("Répartition enregistrée : elle s'applique à « Proposer ma semaine ».","Split saved: it applies to “Suggest my week”.")); return; }
  if(id==="coach-engine"){ S.set.coachEngine=v; saveSettings(); toast(t("Moteur du coach mis à jour.","Coach engine updated.")); return; }
  if(id==="chat-in") return;
  if(id==="kofi-never"){ setKofiOff(e.target.checked); toast(e.target.checked?t("Message désactivé.","Message turned off."):t("Message réactivé.","Message turned back on.")); return; }
  if(id==="kofi-reminder"){ setKofiOff(!e.target.checked); toast(e.target.checked?t("Rappel activé.","Reminder on."):t("Rappel désactivé.","Reminder off.")); return; }
  const map={"s-hrmax":"hrMax","s-hrrest":"hrRest","s-goalh":"goalH","s-rest":"restDay","s-goal":"goal","s-context":"context"};
  if(id==="s-hrmax"&&S.set.hrAuto!==false){ S.set.hrAuto=false; setTimeout(render,0); }
  if(map[id]){ S.set[map[id]] = (id==="s-goal"||id==="s-context") ? v.trim() : (parseFloat(v)||0); saveSettings(); toast(t("Réglages enregistrés.","Settings saved.")); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet();
  if(e.key==="Enter"&&!e.shiftKey&&e.target&&e.target.id==="chat-in"){ e.preventDefault(); const v=e.target.value; e.target.value=""; askCoach(v); } });
function bindDrop(){
  const d=$("#drop"); if(!d) return;
  ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over");}));
  d.addEventListener("drop",e=>importFiles([...e.dataTransfer.files]));
}
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render()); }catch(e){}
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
applyStatic();
initStore();
maybeKofi();
