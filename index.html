  color-scheme:dark}}

/* ============ données d'exemple ============ */
function demoActs(){
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const out=[]; const td=today0(); const start=addDays(startOfWeek(td),-63);
  const week=[ [1,"course",45,"facile"],[1,"renfo",50],[2,"natation",40],[3,"course",50,"intense"],[4,"renfo",45],[4,"velo",60],[5,"basket",80],[6,"course",75,"long"] ];
  for(let w=0;w<10;w++){
    const prog = w===6 ? .75 : 1+w*.03;
    for(const [wd,sp,base,kind] of week){
      const d=addDays(start,w*7+wd); if(d>td) continue;
      if(rnd()<.12) continue;
      const min=Math.round(base*prog*(.9+rnd()*.2)); const dur=min*60;
      let dist=null,hr=null,hrMax=null,asc=null;
      if(sp==="course"){ const pace = kind==="intense"?4.7:kind==="long"?5.75:5.6-w*.03; dist=+(min/pace).toFixed(2); hr=kind==="intense"?168:kind==="long"?148:143; hrMax=hr+18; asc=Math.round(dist*8); }
      if(sp==="velo"){ dist=+(min/60*(24+w*.4)).toFixed(1); hr=132; hrMax=158; asc=Math.round(dist*9); }
      if(sp==="natation"){ dist=+(min*0.042+w*.02).toFixed(2); hr=138; hrMax=158; }
      if(sp==="basket"){ hr=150; hrMax=185; }
      if(sp==="renfo"){ hr=118; hrMax=150; }
      hr = hr ? Math.round(hr+(rnd()-.5)*6) : null;
      out.push({id:"demo"+out.length,date:`${dayKey(d)}T18:${pad(Math.floor(rnd()*59))}`,sport:sp,title:SPORTS[sp].l+(kind==="intense"?t(" — fractionné"," — intervals"):kind==="long"?t(" — sortie longue"," — long run"):""),dist,dur,hr,hrMax,cal:Math.round(min*9),asc,rpe:null,src:"exemple"});
    }
  }
  return out;
}

function load(a){
  const min=(a.dur||0)/60; const {hrMax,hrRest}=S.set;
  if(a.hr && hrMax>hrRest){ const x=Math.min(1,Math.max(0,(a.hr-hrRest)/(hrMax-hrRest))); return min*x*0.64*Math.exp(1.92*x); }
  if(!a.rpe && a.re) return a.re;
  const f = a.sport==="basket"?1.1:a.sport==="renfo"?.85:1;
  return min*0.45*(a.rpe||5)*f;
}
function isHard(a){
  if(a.rpe) return a.rpe>=7;
  if(!a.hr) return false;
  const {hrMax,hrRest}=S.set; return (a.hr-hrRest)/(hrMax-hrRest)>=.78;
}
function dailySeries(acts,days){
  const t=today0(); const map={};
  for(const a of acts){ const k=a.date.slice(0,10); map[k]=(map[k]||0)+load(a); }
  const first = acts.length ? acts.reduce((m,a)=>a.date<m?a.date:m,acts[0].date).slice(0,10) : dayKey(t);

  const missed=plans.filter(p=>{ const d=parseDay(p.date); return d<td && d>=addDays(td,-7) && !acts.some(a=>a.date.slice(0,10)===p.date && a.sport===p.sport); });

  const rank={bad:0,warn:1,info:2,good:3};
  return out.sort((a,b)=>rank[a.lvl]-rank[b.lvl]);

/* ============ générateur de semaine ============ */
function suggestWeek(monday,acts){
  const td=today0(); const m=metrics(acts);
  const from=addDays(td,-27); const rec=acts.filter(a=>parseDay(a.date)>=from);
  const per={}; for(const a of rec){ per[a.sport]=(per[a.sport]||0)+a.dur/60/4; }
  let total=Object.values(per).reduce((s,x)=>s+x,0);
  let factor=1.07, note=t("progression +7 %","+7% progression");
  if(m.acwr>1.3||m.tsb<-20){ factor=.8; note=t("semaine allégée (fatigue)","lighter week (fatigue)"); }
  if(!total){ total=(S.set.goalH||5)*60; per.course=total*.4; per.renfo=total*.25; per.natation=total*.2; per.velo=total*.15; factor=1; note=t("répartition de départ","starting split"); }
  const sessions=[];
  for(const sp of SK){
    const mins=(per[sp]||0)*factor; if(mins<20) continue;
    let n=Math.max(1,Math.round(mins/SPORTS[sp].len)); n=Math.min(n,4);
    const each=Math.round(mins/n/5)*5;
    for(let i=0;i<n;i++){
      let int="facile", title=SPORTS[sp].l+" — endurance", long=false;
      if(sp==="renfo"){ int="modere"; title=i%2?t("Renfo — tirage & gainage","Strength — pull & core"):t("Renfo — poussée & jambes","Strength — push & legs"); }
      else if(sp==="basket"){ int="intense"; title=SPORTS.basket.l; }
      else if(sp==="autre"){ title=t("Activité libre","Free activity"); }
      else if(n>=2 && i===0){ int="intense"; title=sp==="course"?t("Course — fractionné / seuil","Run — intervals / threshold"):sp==="velo"?t("Vélo — intervalles","Bike — intervals"):t("Natation — séries","Swim — sets"); }
      else if(n>=3 && i===n-1 && (sp==="course"||sp==="velo")){ long=true; title=sp==="course"?t("Course — sortie longue","Run — long run"):t("Vélo — sortie longue","Bike — long ride"); }
      const dur = long ? Math.round(each*1.4/5)*5 : (int==="intense"&&sp!=="basket") ? Math.max(30,Math.round(each*.85/5)*5) : each;
      sessions.push({sport:sp,title,dur,int,long});
    }
  }
  const rest=S.set.restDay ?? 0; const load=[0,0,0,0,0,0,0]; const hard=[0,0,0,0,0,0,0]; const res=[];
  const order=[...sessions].sort((a,b)=>(b.long-a.long)||((b.int==="intense")-(a.int==="intense"))||b.dur-a.dur);
  for(const s of order){
    let cands=[0,1,2,3,4,5,6].filter(d=>d!==rest);
    if(s.long) cands=cands.filter(d=>d>=5).concat(cands.filter(d=>d<5));
    let best=null,score=1e9;
    for(const d of cands){
      let sc=load[d];
      if(s.int==="intense"&&(hard[d]||hard[d-1]||hard[d+1])) sc+=500;
      if(s.long&&d<5) sc+=200;
      if(s.int==="intense"&&(d===1||d===3)) sc-=20;
      if(sc<score){ score=sc; best=d; }
    }
    load[best]+=s.dur; if(s.int==="intense"||s.long) hard[best]=1;
    res.push({date:dayKey(addDays(monday,best)),time:S.set.defTime||"18:00",sport:s.sport,title:s.title,dur:s.dur,int:s.int,notes:t(`Proposé automatiquement : ${note}.`,`Suggested automatically: ${note}.`),gen:true});
  }
  return res;
}

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[®™"]/g,"").trim();

async function importFiles(files){
  let parsed=[], errors=[];
  for(const f of files){
    const name=f.name.toLowerCase();
    if(name.endsWith(".fit")||name.endsWith(".zip")){ errors.push(t(`${f.name} : format FIT/ZIP non lu. Exporte l'activité au format TCX ou GPX.`,`${f.name}: FIT/ZIP files aren't supported. Export the activity as TCX or GPX.`)); continue; }
    try{
      const txt=await f.text();
      if(name.endsWith(".csv")) parsed.push(...parseCSV(txt));
      else if(name.endsWith(".tcx")) parsed.push(...parseTCX(txt,name));
      else if(name.endsWith(".gpx")) parsed.push(...parseGPX(txt,name));
      else errors.push(t(`${f.name} : extension non reconnue.`,`${f.name}: unrecognized file type.`));
    }catch(e){ errors.push(`${f.name} : ${e.message}`); }
  }
  const existing=new Set(S.acts.map(a=>a.id));
  const fresh=[]; for(const a of parsed){ a.id="g"+hash(a.date.slice(0,16)+a.sport+Math.round(a.dur/30)); if(!existing.has(a.id) && !findDup(a)){ existing.add(a.id); fresh.push(a); } }

  const status=$("#import-status");
  let n=0;
  if(S.mode==="db"){
    for(const a of fresh){ try{ await putAct(a); }catch(e){ if(e?.code==="quota_exceeded"){ toast(t("Stockage plein : supprime d'anciennes activités.","Storage full: delete some old activities.")); break; } } n++; if(status) status.textContent=t(`Import en cours… ${n}/${fresh.length}`,`Importing… ${n}/${fresh.length}`); }
  } else { S.acts.push(...fresh); lsSet(); n=fresh.length; }
  if(status) status.textContent="";
  toast(t(`${n} activité(s) importée(s)${dup?`, ${dup} doublon(s) ignoré(s)`:""}.`,`${n} activit${n>1?"ies":"y"} imported${dup?`, ${dup} duplicate(s) skipped`:""}.`)+(errors.length?" "+errors[0]:""));
  render();
}

async function fetchStravaSince(since){
  if(S.stravaMode==="api"){
    const tok=await stravaToken(); const after=Math.floor(since.getTime()/1000); const out=[];
    for(let page=1;page<=10;page++){
      const r=await fetch(`/.netlify/functions/strava?action=activities&after=${after}&page=${page}`,{headers:{Authorization:"Bearer "+tok}});
      if(r.status===401) throw {code:"api_auth"}; if(r.status===429) throw {code:"server_unavailable"}; if(!r.ok) throw {code:"api_error"};
      const arr=await r.json(); out.push(...arr.map(fromStravaApi)); if(arr.length<100) break;
    }
    return {list:out,needPerf:false};
  }
  const range_start=`${dayKey(since)}T00:00:00`; let after=null, raw=[], pages=0;
  do{
    const input={first:100,range_start,ordering:"StartDateLocalDesc"}; if(after) input.after=after;
    const r=await S.mcp.callTool("Strava","list_activities",input,{cache:false});
    const p=r.payload||{}; raw.push(...(p.activities||[])); after=p.has_next_page?p.end_cursor:null; pages++;
  }while(after && pages<10);
  return {list:raw.map(fromStrava),needPerf:true};
}
async function syncStrava(){
  if(!S.stravaMode||S.strava.busy) return;

  setMsg(t("Recherche des nouvelles séances…","Looking for new sessions…"));
  try{
    const since=S.set.stravaSync ? new Date(Date.parse(S.set.stravaSync)-3*864e5) : addDays(today0(),-365);
    const {list,needPerf}=await fetchStravaSince(since);
    const have=new Set(S.acts.map(a=>a.id)); const fresh=[];
    for(const a of list){ if(!a.date||!a.dur||have.has(a.id)||findDup(a)) continue; have.add(a.id); fresh.push(a); }
    let n=0;
    for(const a of fresh){
      if(needPerf && n<80){
        try{
          const r=await S.mcp.callTool("Strava","get_activity_performance",{activity_id:a.sid},{cache:false}); const p=r.payload||{};
          if(p.has_heartrate&&p.average_heartrate){ a.hr=Math.round(p.average_heartrate); a.hrMax=p.max_heartrate?Math.round(p.max_heartrate):null; }
          const pe=p.perceived_exertion??p.perceivedExertion; if(typeof pe==="number"&&pe>0) a.rpe=pe;
          if(p.calories&&!a.cal) a.cal=Math.round(p.calories);
        }catch(e){ if(["server_not_connected","needs_reauth","not_in_manifest","approval_required","blocked_by_policy"].includes(e?.code)) throw e; }
      }
      if(S.mode==="db"){ const {id,...body}=a; await refs.acts.doc(id).set(body); } else S.acts.push(a);
      n++; setMsg(t(`Import des séances Strava… ${n}/${fresh.length}`,`Importing Strava sessions… ${n}/${fresh.length}`));
    }
    if(S.mode!=="db") lsSet();
    if(fresh.length&&notifSupported()&&S.set.notifOn&&S.set.notifAnalysis!==false&&Notification.permission==="granted"){
      const all=[...S.acts.filter(x=>!fresh.some(f=>f.id===x.id)),...fresh]; const A=analyzeLast(all,S.plans);
      if(A) showNotif(t(`Séance analysée : ${A.a.title}`,`Session analyzed: ${A.a.title}`),`${A.tag} · ${A.facts.slice(0,3).join(" · ")} — ${A.verdict}`,"forma-last-"+A.a.id);
    }
    S.set.stravaSync=new Date().toISOString();
    if(S.mode==="db"){ try{ await refs.root.set({...S.set}); }catch(e){} }
    setMsg(fresh.length?t(`${fresh.length} nouvelle(s) séance(s) importée(s) depuis Strava.`,`${fresh.length} new session(s) imported from Strava.`):t("Tout est à jour.","Everything is up to date."),false,false);
  }catch(e){ setMsg(stravaErr(e),true,false); S.strava.code=e?.code; }
  render();
}

function coachSystem(){

Dernière séance (calculée par l'app) : ${A?`${A.a.date.slice(0,10)} ${SPORTS[A.a.sport].l} « ${A.a.title} ». ${A.verdict} ${A.lines.join(" ")} ${A.next}`:"aucune"}

function trendText(acts){

  const [sp,n]=cands[0]||[]; if(!sp||n<4) return t("Pas encore assez de séances avec distance pour mesurer une progression (il en faut au moins 4 sur 8 semaines).","Not enough sessions with distance yet to measure progress (at least 4 over 8 weeks).");
  const rec=acts.filter(a=>a.sport===sp&&speedOf(a)&&parseDay(a.date)>=addDays(td,-28)).map(speedOf), old=acts.filter(a=>a.sport===sp&&speedOf(a)&&parseDay(a.date)<addDays(td,-28)&&parseDay(a.date)>=addDays(td,-56)).map(speedOf);
  if(rec.length<2||old.length<2) return t(`En ${SPORTS[sp].l.toLowerCase()}, il me faut des séances sur les deux dernières périodes de 4 semaines pour comparer.`,`For ${SPORTS[sp].l.toLowerCase()}, I need sessions in both of the last two 4-week periods to compare.`);
  return t(`${SPORTS[sp].l} : sur les 4 dernières semaines, ${paceDelta(sp,median(rec),median(old)).replace("ta moyenne récente","les 4 semaines d'avant")} (médianes). Regarde aussi l'onglet Évolution pour la FC à allure égale.`,`${SPORTS[sp].l}: over the last 4 weeks, ${paceDelta(sp,median(rec),median(old)).replace("your recent average","the 4 weeks before")} (medians). Check the Progress tab for heart rate at equal pace too.`);
}
function localReply(q){

  if(has("derniere","dernier","last","hier","yesterday","ma sortie","ma seance","mon footing","mon entrainement","analyse")&&!has("prochaine","next","demain","tomorrow")) return lastTxt();
  if(has("demain","tomorrow","aujourd","today","que faire","quoi faire","what should","prochaine","next","ce soir","tonight")){
    const todayP=plans.filter(p=>p.date===tk&&!acts.some(a=>a.date.slice(0,10)===tk&&a.sport===p.sport));

    if(W.st.k==="over") return t(`Vu ta charge (${W.st.l.toLowerCase()}, fraîcheur ${Math.round(m.tsb)}), le mieux est un repos ou 30 à 40 min très faciles.${list.length?` Si tu gardes « ${list[0].title} », fais-le en facile.`:""}`,`Given your load (${W.st.l.toLowerCase()}, freshness ${Math.round(m.tsb)}), rest or 30–40 easy minutes is best.${list.length?` If you keep “${list[0].title}”, do it easy.`:""}`);
    if(list.length){ let s=`${when} : `+list.map(p=>`« ${p.title} »${p.time?` à ${p.time}`:""}, ${p.dur} min, ${(INT()[p.int]||"").toLowerCase()}`).join(" ; ")+".";
      if(A&&A.hard&&list.some(p=>p.int==="intense")&&parseDay(A.a.date)>=addDays(td,-1)) s+=" "+t("Ta dernière séance était déjà costaude : garde l'intensité pour après-demain si tu sens de la fatigue.","Your last session was already hard: save the intensity for the day after if you feel tired.");
      return s; }
    const last=SK.filter(k=>k!=="autre").map(k=>[k,acts.filter(a=>a.sport===k).map(a=>a.date).sort().pop()||""]).filter(e=>e[1]).sort((a,b)=>a[1].localeCompare(b[1]))[0];
    return t(`Rien de prévu ${when.toLowerCase()}. Vu ta semaine (${W.st.l.toLowerCase()}), une séance facile de 40 à 50 min serait adaptée${last?`, par exemple en ${SPORTS[last[0]].l.toLowerCase()} que tu n'as pas fait depuis ${dayName(last[1].slice(0,10))}`:""}.`,`Nothing planned ${when.toLowerCase()}. Given your week (${W.st.l.toLowerCase()}), an easy 40–50 min session would fit${last?`, e.g. ${SPORTS[last[0]].l.toLowerCase()}, last done ${dayName(last[1].slice(0,10))}`:""}.`);

  if(has("allure","pace","vitesse","speed","progres","progress","ameliore","improv","plus vite","faster")) return trendText(acts);

function chatTurns(){
  const msgs=[]; for(const m of S.chat){ if(m.live||m.err) continue; const role=m.role==="user"?"user":"assistant"; if(msgs.length&&msgs[msgs.length-1].role===role) msgs[msgs.length-1].content+="\n"+m.text; else msgs.push({role,content:m.text}); }
  while(msgs.length&&msgs[0].role!=="user") msgs.shift();
  return msgs.slice(-12);
}
async function askCoach(q){
  q=String(q||"").trim(); if(!q||S.chatBusy) return;
  S.chat.push({role:"user",text:q}); S.chatBusy=true; S.tab="coach"; saveChat(); render();
  const eng=coachEngine(); let reply="", engUsed=eng, note="";
  const live={role:"bot",text:"…",live:true}; S.chat.push(live); render();
  try{
    if(eng==="local"){ await new Promise(r=>setTimeout(r,300)); reply=localReply(q); }
    else if(eng==="claude-sample"){
      const turns=[{role:"user",content:coachSystem()},{role:"assistant",content:t("Compris, je réponds en m'appuyant sur ces données.","Understood, I'll answer based on this data.")},...chatTurns()];
      const r=await S.sample(turns,{modelTier:"default",cache:false,onText:({text})=>{ live.text=text; const el=$("#msg-live"); if(el) el.innerHTML=fmtMsg(text); }});
      reply=r.text;
    } else {
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":coachKey(),"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:900,system:coachSystem(),messages:chatTurns()})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){ const msg=d?.error?.message||""; throw {code:r.status===401?"bad_key":/credit|billing/i.test(msg)?"credit":r.status===429||r.status===529?"busy":"api",message:msg}; }
      reply=(d.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").trim();
    }
  }catch(e){
    engUsed="local"; reply=localReply(q);
    note = e?.code==="bad_key"?t("Clé API refusée : vérifie-la dans Réglages → Coach.","API key rejected: check it in Settings → Coach.")
      : e?.code==="credit"?t("Ton compte API Anthropic n'a plus de crédit.","Your Anthropic API account is out of credit.")
      : e?.code==="busy"||e?.code==="rate_limited"?t("Claude est très sollicité en ce moment.","Claude is busy right now.")
      : e?.code==="not_granted"?t("Claude n'a pas été autorisé pour cette page.","Claude wasn't allowed for this page.")
      : t("Claude n'a pas répondu.","Claude didn't respond.");
    note+=" "+t("Réponse du coach gratuit :","Free coach answer:");
    if(e?.code==="not_granted") S.sample=null;
  }
  S.chat=S.chat.filter(m=>m!==live);
  if(note) S.chat.push({role:"bot",text:note,err:true});
  S.chat.push({role:"bot",text:reply||t("Je n'ai pas de réponse pour l'instant.","I don't have an answer right now."),eng:engUsed});
  S.chatBusy=false; saveChat(); render();
}

/* ============ rappels & calendrier ============ */
const NK="forma-notified";
const notifSupported=()=>!!window.__STANDALONE && "Notification" in window;
let notifTimers=[];
async function showNotif(title,body,tag){
  try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(reg) return reg.showNotification(title,{body,tag,icon:"icon-192.png",badge:"icon-192.png"}); new Notification(title,{body,tag,icon:"icon-192.png"}); }catch(e){}
}
function scheduleNotifs(){
  notifTimers.forEach(clearTimeout); notifTimers=[];
  if(!notifSupported()||!S.set.notifOn||Notification.permission!=="granted") return;
  const lead=(+S.set.notifLead||30)*60e3, now=Date.now();
  let sent={}; try{ sent=JSON.parse(localStorage.getItem(NK)||"{}"); }catch(e){}
  for(const p of S.plans){
    const time=p.time||S.set.defTime||"18:00"; const start=new Date(`${p.date}T${time}`).getTime(); const key=`${p.id}@${p.date}T${time}`;
    if(sent[key]||isNaN(start)||start<now) continue;
    const delay=Math.max(0,start-lead-now); if(delay>864e5) continue;
    notifTimers.push(setTimeout(()=>{
      showNotif(t(`${time} : ${p.title}`,`${time}: ${p.title}`),`${SPORTS[p.sport].l} · ${p.dur} min · ${INT()[p.int]||""}`,key);
      sent[key]=1; try{ localStorage.setItem(NK,JSON.stringify(sent)); }catch(e){}
    },delay));
  }
}
let notifDeb=null; function scheduleNotifsSoon(){ clearTimeout(notifDeb); notifDeb=setTimeout(scheduleNotifs,800); }
async function setNotif(on){
  if(on){
    if(!notifSupported()){ toast(t("Notifications indisponibles ici.","Notifications aren't available here.")); return; }
    const p=await Notification.requestPermission();
    if(p!=="granted"){ toast(t("Notifications refusées : autorise-les dans les réglages du navigateur pour ce site.","Notifications denied: allow them in your browser settings for this site.")); S.set.notifOn=false; saveSettings(); render(); return; }
    if(S.set.notifAnalysis===undefined) S.set.notifAnalysis=true;
    showNotif("Forma",t("Les rappels de séance sont activés.","Session reminders are on."),"forma-test");
  }
  S.set.notifOn=on; saveSettings(); scheduleNotifs(); render();
}
function icsEsc(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1"); }
async function exportWeekIcs(){
  const mon=addDays(startOfWeek(today0()),S.weekOff*7), keys=[0,1,2,3,4,5,6].map(i=>dayKey(addDays(mon,i)));
  const ps=PLANS().filter(p=>keys.includes(p.date));
  if(!ps.length){ toast(t("Aucune séance planifiée cette semaine.","No sessions planned this week.")); return; }
  const lead=+S.set.notifLead||30, stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const fmt=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Forma//Training//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  for(const p of ps){
    const s=new Date(`${p.date}T${p.time||S.set.defTime||"18:00"}`), e=new Date(s.getTime()+(+p.dur||45)*60e3);
    L.push("BEGIN:VEVENT",`UID:${p.id}-${p.date}@forma`,`DTSTAMP:${stamp}`,`DTSTART:${fmt(s)}`,`DTEND:${fmt(e)}`,`SUMMARY:${icsEsc(p.title)}`,
      `DESCRIPTION:${icsEsc(`${SPORTS[p.sport].l} · ${p.dur} min · ${INT()[p.int]||""}${p.notes?"\n"+p.notes:""}`)}`,
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(p.title)}`,`TRIGGER:-PT${lead}M`,"END:VALARM","END:VEVENT");
  }
  L.push("END:VCALENDAR");
  const text=L.join("\r\n"), filename=`forma-${t("semaine","week")}-${isoWeek(mon)}.ics`;
  if(S.dl){ try{ const r=await S.dl.save({filename,data:text}); if(r&&r.status==="saved") toast(t("Fichier calendrier enregistré : ouvre-le pour ajouter les séances.","Calendar file saved: open it to add the sessions.")); }catch(e){ toast(t("Export impossible.","Export failed.")); } return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/calendar"})); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  toast(t(`${ps.length} séance(s) exportée(s) avec rappel ${lead} min avant.`,`${ps.length} session(s) exported with a reminder ${lead} min before.`));
}

function render(){
  if(!S.actsReady && !S.timedOut) return;
  $("#today-line").textContent = `${DAYS_L()[(today0().getDay()+6)%7]} ${fmtDate(today0())} · ${t("semaine","week")} ${isoWeek(today0())}`;
  $("#demo-banner").innerHTML = isDemo() ? `<div class="banner"><span><b>${t("Données d'exemple.","Sample data.")}</b> ${t("Importe ton export Garmin ou connecte Strava pour voir tes propres séances.","Import your Garmin export or connect Strava to see your own sessions.")}</span><button class="btn small" data-go="acts">${t("Importer","Import")}</button></div>` : "";
  const fl=$("#fb-login"); if(fl) fl.hidden=!(S.fb&&S.fb.state==="out");
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const v=$("#view");
  Object.values(charts).forEach(c=>c.destroy()); for(const k in charts) delete charts[k];
  const kept={}; v.querySelectorAll("[data-keep]").forEach(i=>{ if(i.value) kept[i.id]=i.value; });
  v.innerHTML = ({dash:viewDash,plan:viewPlan,acts:viewActs,coach:viewCoach,evo:viewEvo,set:viewSet})[S.tab]();
  if(S.tab==="dash") drawFormChart("c-form",56);
  if(S.tab==="evo"){ drawVolume(); drawFormChart("c-form2",120); drawTrend(); }
  if(S.tab==="acts") bindDrop();
  for(const id in kept){ const i=document.getElementById(id); if(i) i.value=kept[id]; }
  if(S.tab==="coach"){ const c=$("#chat"); if(c) c.scrollTop=c.scrollHeight; }
  scheduleNotifsSoon();
}

function isoWeek(d){ const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-n); const y=new Date(Date.UTC(x.getUTCFullYear(),0,1)); return Math.ceil(((x-y)/864e5+1)/7); }

function actRow(a,actions=true){
  const p=paceStr(a.sport,a); const d=parseDay(a.date);
  return `<div class="act"><span class="sw" style="background:${sc(a.sport)}"></span>
    <div style="min-width:0"><div class="t">${esc(a.title)}</div>
    <div class="m"><span>${fmtDate(d)}</span><span>${fmtDur(a.dur)}</span>${a.dist?`<span>${fmtKm(a.dist)} km</span>`:""}${p?`<span>${p}</span>`:""}${a.hr?`<span>♥ ${Math.round(a.hr)}</span>`:""}<span title="${t("Charge d'entraînement","Training load")}">${Math.round(load(a))} pts</span></div></div>
    ${actions&&!isDemo()?`<div class="side"><button class="icon-btn" data-edit-act="${a.id}">${t("Modifier","Edit")}</button></div>`:"<span></span>"}</div>`;
}
function viewDash(){

  const [ac,al]=acwrState(m.histDays>=21?m.acwr:null); const [tc,tl]=tsbState(m.tsb);

  const upcoming=plans.filter(p=>p.date>=dayKey(td)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);

  <div class="kpis">

    <div class="kpi"><span class="label">${t("Séances · distance","Sessions · distance")}</span><span class="v">${wk.length}<small>· ${fmtKm(wKm)} km</small></span><span class="s">${t("depuis lundi","since Monday")}</span></div>
    <div class="kpi"><span class="label">${t("Charge 7 j / 28 j","Load 7 d / 28 d")}</span><span class="v">${m.acwr!=null?m.acwr.toFixed(2).replace(".",DEC()):"—"}</span><span class="pill ${ac}">${al}</span></div>
    <div class="kpi"><span class="label">${t("Fraîcheur (TSB)","Freshness (TSB)")}</span><span class="v">${m.tsb>0?"+":""}${Math.round(m.tsb)}</span><span class="pill ${tc}">${tl}</span></div>
  </div>

    <section class="card stack" aria-labelledby="h-adv">
      <div class="row between"><h2 id="h-adv">${t("Conseils du jour","Today's advice")}</h2><button class="btn small ghost" id="ai-btn">${t("Demander au coach","Ask the coach")}</button></div>
      <div class="ai-out" id="ai-out">${esc(S.aiText)}</div>
      <div class="advice">${adv.map(a=>`<div class="adv ${a.lvl}"><b></b><div><h4>${esc(a.t)}</h4><p>${esc(a.b)}</p></div></div>`).join("")}</div>
    </section>
    <div class="stack">
      <section class="card stack">
        <div class="row between"><h2>${t("Forme &amp; fatigue","Fitness &amp; fatigue")}</h2><span class="label">${t("8 semaines","8 weeks")}</span></div>
        <div class="legend"><span><i class="sw" style="background:var(--ink)"></i>${t("Forme","Fitness")} (CTL)</span><span><i class="sw" style="background:var(--s-course)"></i>Fatigue (ATL)</span><span><i class="sw" style="background:var(--s-natation);opacity:.5"></i>${t("Fraîcheur","Freshness")} (TSB)</span></div>
        <div class="chartbox"><canvas id="c-form" aria-label="${t("Courbes de forme et fatigue","Fitness and fatigue curves")}"></canvas></div>

function bilanHtml(acts,plans){
  const W=analyzeWeek(acts,plans), A=analyzeLast(acts,plans);
  const ul=xs=>xs.length?`<ul class="bullets">${xs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
  return `<div class="grid g2">
    <section class="card stack"><div class="row between"><h2>${t("Ta semaine","Your week")}</h2><span class="pill ${W.st.lvl}">${W.st.l}</span></div>
      <p class="lead">${esc(W.verdict)}</p>${ul(W.lines)}</section>
    <section class="card stack"><div class="row between"><h2>${t("Dernière séance","Last session")}</h2>${A?`<span class="pill ${A.lvl}">${A.tag}</span>`:""}</div>
      ${A?`<div class="lasthead"><span class="sw" style="background:${sc(A.a.sport)}"></span><b>${esc(A.a.title)}</b><span class="muted">${dayName(A.a.date.slice(0,10))}</span></div>
      <div class="facts">${A.facts.map(f=>`<span>${esc(f)}</span>`).join("")}</div>
      <p class="lead">${esc(A.verdict)}</p>${ul(A.lines)}${A.next?`<p class="hint" style="margin:0">→ ${esc(A.next)}</p>`:""}`:`<div class="empty">${t("Aucune séance pour l'instant.","No sessions yet.")}</div>`}</section>
  </div>`;
}
function planStatus(p,acts){
  const tk=dayKey(today0());
  const done=acts.some(a=>a.date.slice(0,10)===p.date&&a.sport===p.sport);
  if(done) return ["good",t("Fait","Done")]; if(p.date<tk) return ["bad",t("Manqué","Missed")]; if(p.date===tk) return ["info",t("Aujourd'hui","Today")]; return ["mut",t("Prévu","Planned")];
}
function planItem(p){
  const [c,l]=planStatus(p,ACTS()); const d=parseDay(p.date);
  return `<button class="item" style="--c:${sc(p.sport)}" data-edit-plan="${p.id}"><span class="it">${esc(p.title)}</span><span class="im"><span>${DAYS()[(d.getDay()+6)%7]} ${d.getDate()}${p.time?` · ${p.time}`:""}</span><span>${p.dur} min</span><span>${INT()[p.int]||""}</span><span class="pill ${c}">${l}</span></span></button>`;
}
function viewPlan(){
  const acts=ACTS(), plans=PLANS(); const mon=addDays(startOfWeek(today0()),S.weekOff*7); const tk=dayKey(today0());
  let totPlan=0,totDone=0;
  const cols=[0,1,2,3,4,5,6].map(i=>{
    const d=addDays(mon,i), k=dayKey(d);
    const ps=plans.filter(p=>p.date===k); const as=acts.filter(a=>a.date.slice(0,10)===k);
    totPlan+=ps.reduce((s,p)=>s+(+p.dur||0),0); totDone+=as.reduce((s,a)=>s+a.dur/60,0);
    const unmatched=as.filter(a=>!ps.some(p=>p.sport===a.sport));
    return `<div class="day ${k===tk?"today":""}"><div class="dh"><span class="dn">${DAYS()[i]} ${d.getDate()}</span><span class="label">${MONTHS()[d.getMonth()]}</span></div>
      ${ps.map(planItem).join("")}
      ${unmatched.map(a=>`<div class="item done-act" style="--c:${sc(a.sport)}"><span class="it">${esc(a.title)}</span><span class="im"><span>${fmtDur(a.dur)}</span><span class="pill good">${t("Réalisé","Done")}</span></span></div>`).join("")}
      ${!ps.length&&!as.length?`<span class="muted rest" style="font-size:13px">${t("Repos","Rest")}</span>`:""}
      <button class="addday" data-add-plan="${k}">+ ${t("Séance","Session")}</button>
    </div>`;
  }).join("");
  const label = S.weekOff===0?t("Cette semaine","This week"):S.weekOff===1?t("Semaine prochaine","Next week"):S.weekOff===-1?t("Semaine dernière","Last week"):`${t("Semaine","Week")} ${isoWeek(mon)}`;
  return `<div class="stack">
    <div class="row between">
      <div class="weeknav"><button class="btn small ghost" data-week="-1" aria-label="${t("Semaine précédente","Previous week")}">←</button><div><h2>${label}</h2><div class="muted" style="font-size:13px">${fmtDate(mon)} – ${fmtDate(addDays(mon,6))} · ${t("prévu","planned")} ${String(Math.round(totPlan/60*10)/10).replace(".",DEC())} h · ${t("réalisé","done")} ${fmtH(totDone*60)} h</div></div><button class="btn small ghost" data-week="1" aria-label="${t("Semaine suivante","Next week")}">→</button></div>
      <div class="row"><button class="btn small ghost" id="ics-week">📅 ${t("Ajouter au calendrier","Add to calendar")}</button><button class="btn small ghost" id="clear-week">${t("Vider la semaine","Clear week")}</button><button class="btn small" id="gen-week">${t("Proposer ma semaine","Suggest my week")}</button></div>
    </div>
    <p class="hint" style="margin:0">${t(`« Proposer ma semaine » répartit tes sports selon tes 4 dernières semaines, avec un jour de repos (${DAYS_L()[S.set.restDay??0]}), une séance intense par sport d'endurance et la sortie longue le week-end. La charge baisse automatiquement si tu es fatigué.`,`“Suggest my week” spreads your sports based on your last 4 weeks, with a rest day (${DAYS_L()[S.set.restDay??0]}), one hard session per endurance sport and the long session at the weekend. Load drops automatically when you're fatigued.`)}</p>
    <div class="days">${cols}</div>
  </div>`;
}

/* ============ graphiques ============ */
function baseOpts(){
  const tick=cssVar("--muted"), grid=cssVar("--line");
  return {responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{display:false},tooltip:{backgroundColor:cssVar("--btn"),titleColor:cssVar("--btn-ink"),bodyColor:cssVar("--btn-ink"),titleFont:{family:"IBM Plex Mono"},bodyFont:{family:"IBM Plex Mono"}}},
    scales:{x:{ticks:{color:tick,font:{family:"IBM Plex Mono",size:10.5},maxRotation:0,autoSkipPadding:12},grid:{display:false},border:{color:grid}},
            y:{ticks:{color:tick,font:{family:"IBM Plex Mono",size:10.5}},grid:{color:grid},border:{display:false}}}};
}
function drawFormChart(id,days){
  const el=document.getElementById(id); if(!el||!window.Chart) return;
  const ser=dailySeries(ACTS(),days);
  charts[id]=new Chart(el,{data:{labels:ser.map(x=>t(`${x.d.getDate()}/${x.d.getMonth()+1}`,`${x.d.getMonth()+1}/${x.d.getDate()}`)),datasets:[
    {type:"bar",label:t("Fraîcheur","Freshness"),data:ser.map(x=>+x.tsb.toFixed(1)),backgroundColor:cssVar("--s-natation")+"66",borderWidth:0,order:3},
    {type:"line",label:t("Forme","Fitness"),data:ser.map(x=>+x.ctl.toFixed(1)),borderColor:cssVar("--ink"),borderWidth:2.2,pointRadius:0,tension:.3,order:1},
    {type:"line",label:"Fatigue",data:ser.map(x=>+x.atl.toFixed(1)),borderColor:cssVar("--s-course"),borderWidth:1.6,pointRadius:0,tension:.3,order:2}
  ]},options:baseOpts()});
}
function weeksBack(n){ const mon=startOfWeek(today0()); return Array.from({length:n},(_,i)=>addDays(mon,-(n-1-i)*7)); }
function drawVolume(){
  const el=$("#c-vol"); if(!el||!window.Chart) return;
  const wk=weeksBack(12); const acts=ACTS();
  const ds=SK.filter(k=>acts.some(a=>a.sport===k)).map(k=>({label:SPORTS[k].l,backgroundColor:cssVar(SPORTS[k].v),borderRadius:2,
    data:wk.map(w=>+(acts.filter(a=>a.sport===k&&parseDay(a.date)>=w&&parseDay(a.date)<addDays(w,7)).reduce((s,a)=>s+a.dur,0)/3600).toFixed(2))}));
  const o=baseOpts(); o.scales.x.stacked=true; o.scales.y.stacked=true; o.scales.y.ticks.callback=v=>v+" h";
  if(S.set.goalH){ ds.push({type:"line",label:t("Objectif","Goal"),data:wk.map(()=>S.set.goalH),borderColor:cssVar("--muted"),borderDash:[4,4],borderWidth:1.2,pointRadius:0,stack:"goal"}); }
  charts.vol=new Chart(el,{type:"bar",data:{labels:wk.map(w=>`${t("S","W")}${isoWeek(w)}`),datasets:ds},options:o});
}
function drawTrend(){
  const el=$("#c-trend"); if(!el||!window.Chart) return;
  const sp=S.evoSport, mt=S.evoMetric; const acts=ACTS().filter(a=>a.sport===sp).sort((a,b)=>a.date.localeCompare(b.date));
  const o=baseOpts(); const col=cssVar(SPORTS[sp].v); let data,labels,type="line",note="";
  if(mt==="dist"||mt==="time"){
    const wk=weeksBack(16); labels=wk.map(w=>`${t("S","W")}${isoWeek(w)}`); type="bar";
    data=wk.map(w=>{ const xs=acts.filter(a=>parseDay(a.date)>=w&&parseDay(a.date)<addDays(w,7)); return mt==="dist"?+xs.reduce((s,a)=>s+(a.dist||0),0).toFixed(1):+(xs.reduce((s,a)=>s+a.dur,0)/3600).toFixed(2); });
    o.scales.y.ticks.callback=v=>v+(mt==="dist"?" km":" h");
  } else {
    const xs=acts.filter(a=>parseDay(a.date)>=addDays(today0(),-120)).filter(a=>mt==="hr"?a.hr:(a.dist&&a.dur));
    labels=xs.map(a=>{const d=parseDay(a.date);return t(`${d.getDate()}/${d.getMonth()+1}`,`${d.getMonth()+1}/${d.getDate()}`);});
    data=xs.map(a=>{
      if(mt==="hr") return Math.round(a.hr);
      if(sp==="course") return +(a.dur/60/a.dist).toFixed(2);
      if(sp==="natation") return +(a.dur/(a.dist*10)/60).toFixed(2);
      return +(a.dist/(a.dur/3600)).toFixed(1);
    });
    if(mt==="speed"&&(sp==="course"||sp==="natation")){ o.scales.y.reverse=true; o.scales.y.ticks.callback=v=>`${Math.floor(v)}:${pad(Math.round((v%1)*60)%60)}`; note=t("Axe inversé : plus la courbe monte, plus tu vas vite. La moyenne glissante (trait épais) lisse les écarts entre séances faciles et intenses.","Inverted axis: the higher the curve, the faster you go. The rolling average (thick line) smooths out easy vs hard sessions."); }
    else note = mt==="hr" ? t("À allure égale, une FC moyenne qui baisse signale un gain d'endurance.","At the same pace, a falling average heart rate means improved endurance.") : t("Moyenne glissante sur 5 séances en trait épais.","Thick line: 5-session rolling average.");
    o.plugins.tooltip.callbacks={title:(it)=>xs[it[0].dataIndex]?.title||""};
  }
  const sets=[{label:t("Valeur","Value"),data,backgroundColor:col+(type==="bar"?"":"55"),borderColor:col,borderWidth:type==="bar"?0:1,pointRadius:type==="bar"?0:3,pointBackgroundColor:col,showLine:false,borderRadius:2}];
  if(type==="line"&&data.length>=5){ sets.push({label:t("Moyenne","Average"),data:data.map((_,i)=>{ const w=data.slice(Math.max(0,i-4),i+1); return +(w.reduce((s,x)=>s+x,0)/w.length).toFixed(2); }),borderColor:col,borderWidth:2.5,pointRadius:0,tension:.35}); }
  charts.trend=new Chart(el,{type,data:{labels,datasets:sets},options:o});
  $("#trend-note").textContent = data.length?note:t("Pas encore de données pour ce sport.","No data for this sport yet.");
}

/* ============ coach IA ============ */
async function runAI(){
  if(!S.sample||S.aiBusy) return;
  S.aiBusy=true; S.aiText=""; render();
  const acts=ACTS(), m=metrics(acts), td=today0();
  const weeks=weeksBack(6).map(w=>{ const xs=acts.filter(a=>parseDay(a.date)>=w&&parseDay(a.date)<addDays(w,7)); const by={}; xs.forEach(a=>{ by[a.sport]=by[a.sport]||{n:0,h:0,km:0}; by[a.sport].n++; by[a.sport].h+=a.dur/3600; by[a.sport].km+=a.dist||0; });
    return `S${isoWeek(w)} : `+Object.entries(by).map(([k,v])=>`${SPORTS[k].l} ${v.n}× ${v.h.toFixed(1)}h${v.km?` ${v.km.toFixed(1)}km`:""}`).join(", ")||"rien"; });
  const recent=[...acts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(a=>`${a.date.slice(0,10)} ${SPORTS[a.sport].l} ${fmtDur(a.dur)}${a.dist?" "+fmtKm(a.dist)+"km":""}${paceStr(a.sport,a)?" "+paceStr(a.sport,a):""}${a.hr?" FC"+Math.round(a.hr):""}${a.rpe?" RPE"+a.rpe:""}`);
  const upcoming=PLANS().filter(p=>p.date>=dayKey(td)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10).map(p=>`${p.date} ${SPORTS[p.sport].l} ${p.dur}min ${INT()[p.int]} « ${p.title} »`);
  const prompt=`Tu es un entraîneur multisport expérimenté (course, vélo, natation, renforcement, basket). ${t("Réponds en français, tutoiement, ton direct et concret.","Answer in English, addressing the athlete directly, in a direct and concrete tone.")}
Date du jour : ${dayKey(td)}.
Athlète : FC max ${S.set.hrMax}, FC repos ${S.set.hrRest}, objectif ${S.set.goalH} h/semaine. Objectif principal : ${S.set.goal||"non précisé"}.
Indicateurs : forme CTL ${m.ctl.toFixed(0)}, fatigue ATL ${m.atl.toFixed(0)}, fraîcheur TSB ${m.tsb.toFixed(0)}, ratio charge aiguë/chronique ${m.acwr?m.acwr.toFixed(2):"n/d"}, historique ${m.histDays} jours.
Volume des 6 dernières semaines :
${weeks.join("\n")}
12 dernières séances :
${recent.join("\n")}
Séances planifiées à venir :
${upcoming.join("\n")||"aucune"}

Donne 4 à 6 conseils personnalisés pour les 7 prochains jours : ajustements du planning, intensités, récupération, points de vigilance. Chaque conseil sur une ligne commençant par « – ». Cite des chiffres de ses données. 180 mots maximum, pas de titre, pas de markdown.`;
  try{
    const r=await S.sample(prompt,{modelTier:"default",onText:({text})=>{ S.aiText=text; const o=$("#ai-out"); if(o) o.textContent=text; }});
    S.aiText=r.text;
  }catch(e){
    if(e?.code==="not_granted"){ S.sample=null; S.aiText=""; }
    else S.aiText = e?.code==="rate_limited" ? t("Trop de demandes pour le moment. Réessaie dans quelques minutes.","Too many requests right now. Try again in a few minutes.") : t("L'analyse n'a pas abouti. Réessaie plus tard.","The analysis didn't complete. Try again later.");
  }
  S.aiBusy=false; render();
}

/* ============ événements ============ */
document.addEventListener("click",async e=>{
  const el=e.target.closest("button,[data-close],#sheet-bg,#kofi-go"); if(!el) return;
  if(el.id==="sheet-bg"&&e.target===el) return closeSheet();
  if(el.dataset.close!==undefined) return closeSheet();
  if(el.dataset.tab){ S.tab=el.dataset.tab; render(); window.scrollTo({top:0}); return; }
  if(el.dataset.go){ S.tab=el.dataset.go; render(); window.scrollTo({top:0}); return; }
  if(el.dataset.filter){ S.filter=el.dataset.filter; render(); return; }
  if(el.dataset.week){ S.weekOff+=+el.dataset.week; render(); return; }
  if(el.dataset.editAct){ openAct(S.acts.find(a=>a.id===el.dataset.editAct)); return; }
  if(el.dataset.editPlan){ const p=PLANS().find(x=>x.id===el.dataset.editPlan); if(p) openPlan(p); return; }
  if(el.dataset.addPlan){ openPlan(null,el.dataset.addPlan); return; }
  if(el.dataset.ask){ askCoach(el.dataset.ask); return; }
  if(el.id==="kofi-go"){ kofiSave({clicked:Date.now()}); setTimeout(closeSheet,300); return; }
  if(el.dataset.copy!==undefined){ const v=el.dataset.copy; try{ await navigator.clipboard.writeText(v); toast(t("Copié : ","Copied: ")+(el.dataset.label||(v.length>48?v.slice(0,45)+"…":v))); }catch(err){ const span=el.previousElementSibling; if(span){ const r=document.createRange(); r.selectNodeContents(span); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast(t("Sélectionné : copie-le avec ton clavier.","Selected: copy it with your keyboard.")); } return; }
  switch(el.id){
    case "pick": $("#file-in").click(); break;
    case "add-act": openAct(null); break;
    case "ai-btn": askCoach(t("Analyse ma semaine et ma dernière séance, et dis-moi quoi faire ces prochains jours.","Review my week and my last session, and tell me what to do over the next few days.")); break;
    case "chat-send": { const ta=$("#chat-in"); const v=ta?ta.value:""; if(ta) ta.value=""; askCoach(v); break; }
    case "chat-clear": S.chat=[]; saveChat(); render(); break;
    case "ics-week": exportWeekIcs(); break;
    case "coach-key-save": { const k=($("#coach-key")?.value||"").trim(); if(!/^sk-ant-/.test(k)){ toast(t("Colle une clé qui commence par sk-ant-.","Paste a key starting with sk-ant-.")); break; }
      try{ if(refs&&refs.coach){ await refs.coach.set({apiKey:k}); } else localStorage.setItem("forma-anthropic-key",k); S.coachKey=k; toast(t("Clé enregistrée : le coach utilise maintenant Claude.","Key saved: the coach now uses Claude.")); render(); }catch(e){ toast(t("Enregistrement impossible.","Couldn't save.")); } break; }
    case "coach-key-del": try{ if(refs&&refs.coach) await refs.coach.delete(); localStorage.removeItem("forma-anthropic-key"); }catch(e){} S.coachKey=null; toast(t("Clé supprimée.","Key removed.")); render(); break;
    case "strava-sync": if(S.stravaMode==="api" && (!S.stravaTok || el.dataset.reconnect)) stravaAuthorize(); else syncStrava(); break;
    case "lang-btn": setLang(LANG==="en"?"fr":"en"); break;
    case "fb-setup": openFbSetup(); break;
    case "fb-save": {
      const c=parseFbConfig($("#fb-paste").value);
      if(!c){ toast(t("Configuration incomplète : copie tout le bloc firebaseConfig.","Incomplete configuration: copy the whole firebaseConfig block.")); break; }
      try{ localStorage.setItem(FBK,JSON.stringify(c)); }catch(err){ toast(t("Impossible d'enregistrer sur cet appareil (navigation privée ?).","Can't save on this device (private browsing?).")); break; }
      toast(t("Configuration enregistrée. Redémarrage…","Configuration saved. Restarting…")); setTimeout(()=>location.reload(),700); break; }
    case "sa-save": {
      const id=$("#sa-id").value.trim(), sec=$("#sa-secret").value.trim();
      if(!/^\d+$/.test(id)||sec.length<20){ toast(t("Vérifie le Client ID (que des chiffres) et le Client Secret (longue suite de caractères).","Check the Client ID (digits only) and the Client Secret (long string of characters).")); break; }
      el.disabled=true;
      try{ const app={clientId:id,clientSecret:sec}; await refs.stravaApp.set(app); S.stravaApp=app; resolveStravaMode(); stravaAuthorize(); }
      catch(e){ el.disabled=false; toast(t("Enregistrement impossible : vérifie les règles Firestore.","Couldn't save: check your Firestore rules.")); }
      break; }
    case "strava-app-reset": if(refs&&refs.stravaApp){ await refs.stravaApp.delete(); if(refs.strava) await refs.strava.delete(); S.strava={busy:false,msg:"",err:false}; toast(t("App Strava retirée. Tu peux en saisir une nouvelle dans Activités.","Strava app removed. You can enter a new one in Activities.")); } break;
    case "fb-login": case "fb-login-2": case "fb-login-3": fbLogin(); break;
    case "fb-logout": if(S.fb&&S.fb.auth){ await S.fb.auth.signOut(); toast(t("Déconnecté.","Signed out.")); } break;
    case "strava-unlink": if(refs&&refs.strava){ await refs.strava.delete(); S.set.stravaSync=null; saveSettings(); toast(t("Strava déconnecté.","Strava unlinked.")); } break;
    case "dl-app": case "dl-app-2": downloadApp(); break;
    case "install-app": if(S.installEvt){ S.installEvt.prompt(); S.installEvt=null; $("#install-app").hidden=true; } break;
    case "a-del": if(el.dataset.confirm){ await delAct(el.dataset.id); closeSheet(); toast(t("Activité supprimée.","Activity deleted.")); } else { el.dataset.confirm="1"; el.textContent=t("Confirmer la suppression","Confirm delete"); el.classList.add("danger"); } break;
    case "p-del": if(String(el.dataset.id).startsWith("dp")){ closeSheet(); toast(t("Séance d'exemple : génère ta propre semaine.","Sample session: generate your own week.")); break; } if(el.dataset.confirm){ await delPlan(el.dataset.id); closeSheet(); toast(t("Séance supprimée.","Session deleted.")); } else { el.dataset.confirm="1"; el.textContent=t("Confirmer la suppression","Confirm delete"); el.classList.add("danger"); } break;
    case "gen-week": {
      const mon=addDays(startOfWeek(today0()),S.weekOff*7); const keys=[0,1,2,3,4,5,6].map(i=>dayKey(addDays(mon,i)));
      const gen=suggestWeek(mon,ACTS()).filter(p=>p.date>=dayKey(today0()));
      if(!gen.length){ toast(t("Cette semaine est passée : avance d'une semaine pour planifier.","This week is over: move ahead a week to plan.")); break; }
      el.disabled=true;
      for(const p of S.plans.filter(p=>p.gen&&keys.includes(p.date)&&p.date>=dayKey(today0()))) await delPlan(p.id);
      for(const p of gen) await putPlan({...p,id:"p"+uid()});
      toast(t(`${gen.length} séances proposées. Touche une séance pour l'ajuster.`,`${gen.length} sessions suggested. Tap a session to adjust it.`)); break; }
    case "clear-week": {
      const mon=addDays(startOfWeek(today0()),S.weekOff*7); const keys=[0,1,2,3,4,5,6].map(i=>dayKey(addDays(mon,i)));
      const ps=S.plans.filter(p=>keys.includes(p.date)); if(!ps.length){ toast(t("Aucune séance planifiée cette semaine.","No sessions planned this week.")); break; }
      if(!el.dataset.confirm){ el.dataset.confirm="1"; el.textContent=t(`Supprimer ${ps.length} séance(s) ?`,`Delete ${ps.length} session(s)?`); el.classList.add("danger"); break; }
      for(const p of ps) await delPlan(p.id); toast(t("Semaine vidée.","Week cleared.")); break; }
    case "wipe": $("#wipe-zone").innerHTML=`<span class="muted">${t(`Supprimer ${S.acts.length} activités et ${S.plans.length} séances ? C'est définitif.`,`Delete ${S.acts.length} activities and ${S.plans.length} sessions? This can't be undone.`)}</span><button class="btn small ghost" id="wipe-no">${t("Annuler","Cancel")}</button><button class="btn small danger" id="wipe-yes">${t("Tout effacer","Delete everything")}</button>`; break;
    case "wipe-no": render(); break;
    case "wipe-yes": { const st=$("#wipe-zone"); st.innerHTML=`<span class="muted">${t("Suppression…","Deleting…")}</span>`; for(const a of [...S.acts]) await delAct(a.id); for(const p of [...S.plans]) await delPlan(p.id); toast(t("Données effacées.","Data deleted.")); render(); break; }
  }
});
document.addEventListener("change",e=>{
  const id=e.target.id; const v=e.target.value;
  if(id==="file-in"){ importFiles([...e.target.files]); e.target.value=""; return; }
  if(id==="evo-sport"){ S.evoSport=v; render(); return; }
  if(id==="evo-metric"){ S.evoMetric=v; render(); return; }
  if(id==="s-lang"){ setLang(v); return; }
  if(id==="notif-on"){ setNotif(e.target.checked); return; }
  if(id==="notif-analysis"){ S.set.notifAnalysis=e.target.checked; saveSettings(); return; }
  if(id==="notif-lead"){ S.set.notifLead=+v; saveSettings(); scheduleNotifs(); toast(t("Rappel mis à jour.","Reminder updated.")); return; }
  if(id==="s-deftime"){ S.set.defTime=v; saveSettings(); scheduleNotifs(); return; }
  if(id==="coach-engine"){ S.set.coachEngine=v; saveSettings(); toast(t("Moteur du coach mis à jour.","Coach engine updated.")); return; }
  if(id==="chat-in") return;
  if(id==="kofi-never"){ setKofiOff(e.target.checked); toast(e.target.checked?t("Message désactivé.","Message turned off."):t("Message réactivé.","Message turned back on.")); return; }
  if(id==="kofi-reminder"){ setKofiOff(!e.target.checked); toast(e.target.checked?t("Rappel activé.","Reminder on."):t("Rappel désactivé.","Reminder off.")); return; }
  const map={"s-hrmax":"hrMax","s-hrrest":"hrRest","s-goalh":"goalH","s-rest":"restDay","s-goal":"goal"};
  if(map[id]){ S.set[map[id]] = id==="s-goal" ? v.trim() : (parseFloat(v)||0); saveSettings(); toast(t("Réglages enregistrés.","Settings saved.")); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet();
  if(e.key==="Enter"&&!e.shiftKey&&e.target&&e.target.id==="chat-in"){ e.preventDefault(); const v=e.target.value; e.target.value=""; askCoach(v); } });
function bindDrop(){
  const d=$("#drop"); if(!d) return;
  ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over");}));
  d.addEventListener("drop",e=>importFiles([...e.dataTransfer.files]));
}
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render()); }catch(e){}
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
applyStatic();
initStore();
maybeKofi();
</script></body></html>
